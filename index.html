      const n = +sub[0], l = 'spd'.indexOf(sub[1]), k = 2 * l + 1; const i = idx - 1; const orb = i % k; const m = -l + orb; const s = i < k ? '+½' : '−½';
      const ex = (Z === 24 || Z === 29) ? '<br><span class="small">বিঃদ্রঃ Cr ও Cu-এর প্রকৃত বিন্যাসে একটি 4s ইলেকট্রন 3d-তে যায়; এখানে আউফবাউ ক্রমে শেষ ইলেকট্রন দেখানো হয়েছে।</span>' : '';

V.atom3d = {
  t: '৩D পরমাণু মডেল: নিউক্লিয়াস ও শক্তিস্তর', k: ['3d', 'int'],
  cap: 'লাল: প্রোটন, ধূসর: নিউট্রন, নীল: ইলেকট্রন। প্রতিটি বলয় একটি প্রধান শক্তিস্তর (K, L, M, N)। এটি বোঝার জন্য সরলীকৃত মডেল — প্রকৃতপক্ষে ইলেকট্রন অরবিটালে মেঘ আকারে থাকে এবং নিউক্লিয়াস পরমাণুর তুলনায় প্রায় ১০⁵ গুণ ছোট। টেনে ঘোরাও।',
  html: () => X.cv('৩D পরমাণু') + `<div class="ctl"><label style="flex:none">Z</label><input type="range" min="1" max="30" value="11" data-z style="flex:1;min-width:140px"><button class="btn sm" data-pp></button></div><div class="calc-out" data-out></div>`,
  mount(el) {
    const c = el.querySelector('canvas'); const hf = W => Math.min(380, Math.max(250, W * 0.72)); let L = X.fit(c, hf);
    let Z = 11, nuc = [], yaw = 0.4, pitch = 0.35, t = 0;
    const build = () => {
      const e = X.EL[Z - 1], A_ = e[2], N = A_ - Z, rnd = X.rng(Z * 7 + 3); nuc = [];
      const R = 0.06 + 0.035 * Math.cbrt(A_);
      for (let i = 0; i < A_; i++) { let x, y, z; do { x = rnd() * 2 - 1; y = rnd() * 2 - 1; z = rnd() * 2 - 1; } while (x * x + y * y + z * z > 1); nuc.push([x * R, y * R, z * R, i < Z ? 1 : 0]); }
      for (let i = nuc.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [nuc[i], nuc[j]] = [nuc[j], nuc[i]]; }
      const sh = X.shells(Z);
      el.querySelector('[data-out]').innerHTML = `<b>${e[0]} · ${e[1]}</b> — Z = ${X.bn(Z)}, A = ${X.bn(A_)} · প্রোটন ${X.bn(Z)}, নিউট্রন ${X.bn(N)}, ইলেকট্রন ${X.bn(Z)}<br>শক্তিস্তরে বিন্যাস: ${sh.map((n, i) => 'KLMN'[i] + ' ' + X.bn(n)).join(', ')} · ${X.cfg(Z, 'n')}`;
    };
    el.querySelector('[data-z]').addEventListener('input', e => { Z = +e.target.value; build(); A.draw(); });
    build();
    const dragging = X.drag(c, (dx, dy) => { yaw += dx * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.01)); A.draw(); });
    const A = X.anim(c, dt => {
      t += dt; if (!dragging()) yaw += dt * 0.25;
      const C = X.C(), g = L.g, W = L.W, H = L.H, S = Math.min(W, H) * 0.44, cx = W / 2, cy = H / 2;
      const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const P = (x, y, z) => { const X1 = x * cyw + z * syw, Z1 = -x * syw + z * cyw; const Y2 = y * cp - Z1 * sp, Z2 = y * sp + Z1 * cp; const f = 3 / (3 + Z2); return [cx + X1 * S * f, cy - Y2 * S * f, Z2, f]; };
      const sh = X.shells(Z); g.clearRect(0, 0, W, H);
      const items = [];
      sh.forEach((cnt, i) => {
        const r = 0.32 + i * 0.22, tilt = 0.5 + i * 0.7, rot = i * 1.1;
        const pt = a => { let x = r * Math.cos(a), y = 0, z = r * Math.sin(a); const y1 = y * Math.cos(tilt) - z * Math.sin(tilt), z1 = y * Math.sin(tilt) + z * Math.cos(tilt); const x2 = x * Math.cos(rot) - z1 * Math.sin(rot), z2 = x * Math.sin(rot) + z1 * Math.cos(rot); return P(x2, y1, z2); };
        g.strokeStyle = C.ln; g.lineWidth = 1; g.beginPath(); for (let k = 0; k <= 72; k++) { const p = pt(k / 72 * 6.283); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke();
        for (let k = 0; k < cnt; k++) { const p = pt(k / cnt * 6.283 + t * (1.2 / (i + 1))); items.push([p[2], 'e', p]); }
      });
      for (const n of nuc) { const p = P(n[0], n[1], n[2]); items.push([p[2], n[3] ? 'p' : 'n', p]); }
      items.sort((a, b) => b[0] - a[0]);
      for (const [, k, p] of items) {
        const rr = k === 'e' ? 4.5 * p[3] : 5.2 * p[3] * S / 160;
        const grd = g.createRadialGradient(p[0] - rr * .35, p[1] - rr * .35, rr * .1, p[0], p[1], rr);
        const base = k === 'e' ? C.acc : k === 'p' ? '#e0534a' : '#9aa0a8';
        grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.35, base); grd.addColorStop(1, base);
        g.fillStyle = grd; g.beginPath(); g.arc(p[0], p[1], Math.max(1.5, rr), 0, 6.283); g.fill();
      }
      g.font = `12px ${C.font}`; g.fillStyle = C.mu;
      sh.forEach((cnt, i) => g.fillText('KLMN'[i] + ': ' + X.bn(cnt), 10, 18 + i * 16));
    }, { paused: X.rm() });
    X.pp(el, A);
    const ro = X.onResize(el, () => { L = X.fit(c, hf); A.draw(); });
    return () => { A.stop(); ro(); };
  }
};

V.decaySim = {
  t: 'অর্ধায়ু সিমুলেশন: তেজস্ক্রিয় ক্ষয়', k: ['anim', 'int'],

  html: () => X.cv('অর্ধায়ু সিমুলেশন') + `<div class="ctl"><label>অর্ধায়ু</label>${X.seg('th', [[2, '২ সে.'], [4, '৪ সে.'], [8, '৮ সে.']], 4)}<button class="btn sm" data-pp></button><button class="btn sm" data-reset>${X.ico('repeat')}আবার</button></div><div class="calc-out" data-out></div>`,
  mount(el) {
    const c = el.querySelector('canvas'); const hf = W => W >= 560 ? 280 : Math.round(W * 0.92 + 190); let L = X.fit(c, hf);
    const N0 = 400; let th = 4, atoms, t, hist;
    const reset = () => { atoms = new Array(N0).fill(1); t = 0; hist = [[0, N0]]; };
    reset();
    const out = el.querySelector('[data-out]');
    X.onSeg(el, 'th', k => { th = +k; reset(); A.draw(); });
    el.querySelector('[data-reset]').onclick = () => { reset(); A.pause(false); X.pp(el, A); };
    const A = X.anim(c, dt => {
      if (dt && t < 5 * th) { t += dt; const p = 1 - Math.pow(0.5, dt / th); for (let i = 0; i < N0; i++) if (atoms[i] && Math.random() < p) atoms[i] = 0; const n = atoms.reduce((a, b) => a + b, 0); hist.push([t, n]); }
      const C = X.C(), g = L.g, W = L.W, H = L.H, side = W >= 560; g.clearRect(0, 0, W, H);
      const gs = side ? Math.min(H - 20, W * 0.42) : Math.min(W - 20, 220); const gx = side ? 10 : (W - gs) / 2, gy = 10, cell = gs / 20;
      for (let i = 0; i < N0; i++) { const r = Math.floor(i / 20), q = i % 20; g.fillStyle = atoms[i] ? C.a2 : C.s3; g.beginPath(); g.arc(gx + q * cell + cell / 2, gy + r * cell + cell / 2, cell * 0.36, 0, 6.283); g.fill(); }
      const px = side ? gx + gs + 46 : 48, py = side ? 16 : gy + gs + 22, pw = side ? W - px - 14 : W - 66, ph = side ? H - 48 : H - py - 34;
      g.strokeStyle = C.fg; g.lineWidth = 1; g.beginPath(); g.moveTo(px, py); g.lineTo(px, py + ph); g.lineTo(px + pw, py + ph); g.stroke();
      const sx = v => px + v / (5 * th) * pw, sy = v => py + ph - v / N0 * ph;
      g.font = `11px ${C.mono}`; g.fillStyle = C.mu;
      for (let k = 0; k <= 5; k++) { g.fillText(k + 't½', sx(k * th) - 8, py + ph + 14); g.strokeStyle = C.line; g.beginPath(); g.moveTo(sx(k * th), py); g.lineTo(sx(k * th), py + ph); g.stroke(); }
      [400, 200, 100, 50].forEach(v => { g.fillText(String(v), px - 30, sy(v) + 4); g.strokeStyle = C.line; g.beginPath(); g.moveTo(px, sy(v)); g.lineTo(px + pw, sy(v)); g.stroke(); });
      g.setLineDash([4, 4]); g.strokeStyle = C.mu; g.beginPath(); for (let k = 0; k <= 100; k++) { const tt = k / 100 * 5 * th; const v = N0 * Math.pow(0.5, tt / th); k ? g.lineTo(sx(tt), sy(v)) : g.moveTo(sx(tt), sy(v)); } g.stroke(); g.setLineDash([]);
      g.strokeStyle = C.a2; g.lineWidth = 2; g.beginPath(); hist.forEach(([a, b], k) => k ? g.lineTo(sx(a), sy(b)) : g.moveTo(sx(a), sy(b))); g.stroke();
      const n = hist[hist.length - 1][1];
      out.innerHTML = `সময় t = <b>${X.bn(t.toFixed(1))} সে.</b> (${X.bn((t / th).toFixed(2))} অর্ধায়ু) · অবশিষ্ট N = <b>${X.bn(n)}</b> · তাত্ত্বিক N₀(½)<sup>t/t½</sup> = <b>${X.bn(Math.round(N0 * Math.pow(0.5, t / th)))}</b>`;
      if (t >= 5 * th && !A.paused) { A.pause(true); X.pp(el, A); }
    }, { paused: false });
    X.pp(el, A);
    const ro = X.onResize(el, () => { L = X.fit(c, hf); A.draw(); });
    return () => { A.stop(); ro(); };
  }
};

const RH = 1.0968e7;
const SER = [['লাইম্যান', 1, 'UV'], ['বামার', 2, 'দৃশ্যমান'], ['পাশেন', 3, 'IR'], ['ব্র্যাকেট', 4, 'IR'], ['ফুন্ড', 5, 'দূর IR']];
const lamNm = (n1, n2, Z = 1) => 1e9 / (RH * Z * Z * (1 / (n1 * n1) - 1 / (n2 * n2)));
V.hSeries = {

  cap: 'একটি ধারা বেছে নাও। শক্তিস্তর চিত্রে ঐ ধারার সব স্থানান্তর (তীর) এবং নিচে বর্ণালিতে রেখাগুলোর অবস্থান দেখা যাবে। প্রতিটি ধারার রেখাগুলো ছোট তরঙ্গদৈর্ঘ্যের দিকে ক্রমশ ঘন হয়ে ধারা-সীমায় (n₂ → ∞) মিলিত হয়। শক্তিস্তরের ব্যবধান স্কেল অনুপাতে নয়।',
  html: () => `<div class="ctl" style="margin:0 0 8px">${X.seg('ser', SER.map(([n, k]) => [k, n]), 2)}</div><div data-svg></div><div data-tab></div>`,
  mount(el) {
    const box = el.querySelector('[data-svg]'), tab = el.querySelector('[data-tab]');
    const yN = n => n === Infinity ? 34 : 262 - 220 * (1 - 1 / n);
    const xs = { 1: 64, 2: 134, 3: 204, 4: 262, 5: 316 };

      let delay = 0;
      SER.forEach(([nm, n1]) => {
        const on = n1 === sel;
        for (let n2 = n1 + 1; n2 <= 7; n2++) {
          const x = xs[n1] + (n2 - n1 - 1) * 8, w = lamNm(n1, n2), vis = w >= 380 && w <= 750;

          s += `<line x1="${x}" y1="${yN(n2)}" x2="${x}" y2="${yN(n1) - 5}" stroke="${col}" stroke-width="${on ? 2.4 : 1.2}" ${on ? `style="stroke-dasharray:300;stroke-dashoffset:300;animation:drawln .5s ${(delay += .18).toFixed(2)}s forwards"` : ''}/><path d="M${x - 3.5} ${yN(n1) - 8} L${x + 3.5} ${yN(n1) - 8} L${x} ${yN(n1) - 1}Z" fill="${col}"/>`;
        }

      });

      const y0 = 290; s += `<rect x="10" y="${y0}" width="${lx(400) - 10}" height="22" fill="#4a2a78" opacity=".55"/><rect x="${lx(400)}" y="${y0}" width="${lx(700) - lx(400)}" height="22" fill="url(#hsV)"/><rect x="${lx(700)}" y="${y0}" width="${390 - lx(700)}" height="22" fill="#5a1a1a" opacity=".55"/>`;
      s += `<text x="${(10 + lx(400)) / 2}" y="${y0 + 36}" text-anchor="middle" class="tm">UV</text><text x="${(lx(400) + lx(700)) / 2}" y="${y0 + 36}" text-anchor="middle" class="tm">দৃশ্যমান</text><text x="${(lx(700) + 390) / 2}" y="${y0 + 36}" text-anchor="middle" class="tm">IR</text>`;
      for (let n2 = sel + 1; n2 <= 12; n2++) { const w = lamNm(sel, n2); s += `<line x1="${lx(w)}" y1="${y0 - 4}" x2="${lx(w)}" y2="${y0 + 26}" stroke="var(--fg)" stroke-width="${n2 <= 7 ? 2 : 1}" opacity="${n2 <= 7 ? 1 : .5}"/>`; }
      const lim = lamNm(sel, 1e9); s += `<line x1="${lx(lim)}" y1="${y0 - 8}" x2="${lx(lim)}" y2="${y0 + 26}" stroke="var(--bad)" stroke-dasharray="2 2"/><text x="${lx(lim)}" y="${y0 - 11}" text-anchor="middle" style="font-size:10px;fill:var(--bad)">সীমা</text>`;
      [100, 1000].forEach(w => s += `<text x="${lx(w)}" y="${y0 + 50}" text-anchor="middle" class="tm mono" style="font-size:9.5px">${w} nm</text>`);
      box.innerHTML = X.svg(400, 346, s, 'হাইড্রোজেন বর্ণালি');
      const S = SER.find(q => q[1] === sel);
      const rows = []; for (let n2 = sel + 1; n2 <= sel + 5; n2++) { const w = lamNm(sel, n2); rows.push(`<tr><td>${n2} → ${sel}</td><td class="mono">${(1e7 / w).toFixed(0)}</td><td class="mono"><b>${w >= 1000 ? (w / 1000).toFixed(3) + ' μm' : w.toFixed(1) + ' nm'}</b></td><td>${w < 400 ? 'UV' : w <= 700 ? '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + X.wl(w) + '"></span> দৃশ্যমান' : 'IR'}</td></tr>`); }
      tab.innerHTML = `<div class="table-wrap" style="margin-bottom:0"><table class="t"><thead><tr><th>স্থানান্তর</th><th>ν̄ (cm⁻¹)</th><th>λ</th><th>অঞ্চল</th></tr></thead><tbody>${rows.join('')}<tr><td>∞ → ${sel} (ধারা-সীমা)</td><td class="mono">${(1e7 / lim).toFixed(0)}</td><td class="mono"><b>${lim >= 1000 ? (lim / 1000).toFixed(3) + ' μm' : lim.toFixed(1) + ' nm'}</b></td><td>${S[2]}</td></tr></tbody></table></div>`;
    };
    X.onSeg(el, 'ser', draw); draw(2);
  }
};

      s += `<circle cx="${cx - 46}" cy="148" r="10" fill="${heat(part('hand'))}"/><circle cx="${cx + 46}" cy="148" r="10" fill="${heat(part('hand'))}"/>`;
      s += `<rect x="${cx - 28}" y="148" width="24" height="44" rx="10" fill="${heat(part('leg'))}"/><rect x="${cx + 4}" y="148" width="24" height="44" rx="10" fill="${heat(part('leg'))}"/>`;
      s += `<circle cx="${cx - 16}" cy="198" r="13" fill="${heat(part('kneeL'))}"/><circle cx="${cx + 16}" cy="198" r="13" fill="${heat(part('kneeR'))}"/>`;
      s += `<rect x="${cx - 28}" y="206" width="24" height="36" rx="10" fill="${heat(part('leg') - .06)}"/><rect x="${cx + 4}" y="206" width="24" height="36" rx="10" fill="${heat(part('leg') - .06)}"/>`;
      s += `<rect x="${cx - 32}" y="240" width="28" height="10" rx="5" fill="${heat(part('foot'))}"/><rect x="${cx + 4}" y="240" width="28" height="10" rx="5" fill="${heat(part('foot'))}"/>`;
      if (st === 'k') s += `<circle cx="${cx - 16}" cy="198" r="22" fill="none" stroke="#fff" stroke-dasharray="3 3"/><text x="${cx - 44}" y="232" style="font-size:11px;fill:#fff">প্রদাহ</text>`;

      const K = T + 273.15, lm = 2.898e-3 / K;
      out.innerHTML = `T = ${T.toFixed(1)}°C = ${K.toFixed(2)} K → λ<sub>max</sub> = 2.898×10⁻³ / ${K.toFixed(2)} = <b>${(lm * 1e6).toFixed(2)} μm</b> (দূর-অবলোহিত) · একক ফোটনের শক্তি ≈ <b>${(h * c / lm / eV * 1000).toFixed(0)} meV</b><br><span class="small">${st === 'f' ? 'জ্বরে পুরো দেহ, বিশেষত কপাল ও বুক বেশি উষ্ণ দেখায় — বিমানবন্দরে থার্মাল স্ক্যানারে জ্বর শনাক্ত করা হয়।' : st === 'k' ? 'প্রদাহস্থলে রক্তপ্রবাহ বেড়ে তাপমাত্রা বাড়ে — থার্মোগ্রাফিতে আশপাশের চেয়ে উজ্জ্বল দেখায়।' : 'সুস্থ দেহে মাথা ও বুক উষ্ণতম; হাত-পায়ের প্রান্ত তুলনামূলক শীতল।'}</span>`;

  }

V.mriSim = {
  t: 'MRI-এর মূলনীতি: প্রোটনের স্পিন, অনুনাদ ও শিথিলায়ন', k: ['anim', 'int'],
  cap: '১) সাধারণ অবস্থায় দেহের হাইড্রোজেন নিউক্লিয়াস (প্রোটন) এলোমেলো দিকে থাকে। ২) শক্তিশালী চৌম্বকক্ষেত্র B₀ এ এরা ক্ষেত্রের দিকে (সামান্য বেশি সংখ্যক) সারিবদ্ধ হয়ে লারমর কম্পাঙ্কে ঘোরে (প্রিসেশন)। ৩) ঠিক ঐ কম্পাঙ্কের রেডিও তরঙ্গ পালস দিলে অনুনাদে এরা কাত হয়ে যায়। ৪) পালস বন্ধ করলে এরা আগের অবস্থায় ফেরে এবং রেডিও সংকেত বিকিরণ করে — কম্পিউটার সেই সংকেত থেকে ছবি তৈরি করে।',

    const N = 24, rnd = X.rng(9); const P = Array.from({ length: N }, (_, i) => ({ a: rnd() * 6.283, up: i % 7 !== 3, ph: rnd() * 6.283, tilt: 0 }));
    let step = 0, t = 0, B = 1.5, sig = [], auto = null;
    const out = el.querySelector('[data-out]');

const KEY = 'hsc-chem2-state-v1';
const DEF = () => ({ v: 1, done: {}, bm: {}, notes: {}, hl: {}, qs: {}, quiz: {}, wrong: {}, fc: {}, days: {}, secDays: {}, goal: { l: 3, m: 30 }, mega: null, megaRun: null, last: null, theme: 'auto', updatedAt: 0 });

}
const cloud = {
  ref: null, busy: false, dirty: false, timer: null, fails: 0, on: false,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/state');
      const snap = await this.ref.get();
      let remoteAt = 0;
      if (snap.exists) { const d = snap.data(); if (d && d.json) { try { const r = JSON.parse(d.json); remoteAt = r.updatedAt || 0; merge(r); } catch (e) { } } }
      this.on = true; syncBadge();
      if ((S.updatedAt || 0) > remoteAt) this.schedule();
    } catch (e) { this.ref = null; this.on = false; syncBadge(); }
  },
  schedule() { if (!this.ref) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 2500); },
  async flush() {
    if (!this.ref || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    try { await this.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt }); this.fails = 0; this.on = true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' && this.fails < 1) { this.fails++; this.dirty = true; }
      else if (c !== 'unavailable') { this.ref = null; this.on = false; }
    } finally {
      this.busy = false; syncBadge();

    }
  }
};
function merge(r) {
  const R = Object.assign(DEF(), r);
  const newer = (R.updatedAt || 0) > (S.updatedAt || 0);
  const base = newer ? R : S, other = newer ? S : R;
  base.done = Object.assign({}, other.done, base.done);
  for (const d in other.days) { const a = base.days[d] || {}, b = other.days[d] || {}; base.days[d] = { l: Math.max(a.l || 0, b.l || 0), m: Math.max(a.m || 0, b.m || 0), q: Math.max(a.q || 0, b.q || 0) }; }
  for (const s in other.secDays) base.secDays[s] = Object.assign({}, other.secDays[s], base.secDays[s] || {});
  for (const q in other.qs) { if (!base.qs[q] || (other.qs[q].t || 0) > (base.qs[q].t || 0)) base.qs[q] = other.qs[q]; }
  S = base;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  applyTheme(); render(true);
}

function secStats(s) {
  const total = s.L.length, done = s.L.filter(l => S.done[l.id]).length, comp = total ? done / total : 0;
  let att = 0, cor = 0, n = s.allM.length;
  for (const id of s.allM) { const r = S.qs[id]; if (r) { att++; if (r.last) cor++; } }
  const acc = att ? cor / att : 0, cov = n ? Math.min(1, att / Math.max(1, n * 0.6)) : 0;
  const mastery = Math.round(100 * (n ? 0.3 * comp + 0.7 * acc * cov : comp));
  const qz = S.quiz[s.id] || null;
  const minsLeft = s.L.filter(l => !S.done[l.id]).reduce((a, l) => a + readMin(l), 0) + (qz || !n ? 0 : 8);
  const days = Object.keys(S.secDays[s.id] || {});
  const last7 = days.filter(d => daysAgo(d) < 7).length;
  return { total, done, rem: total - done, comp, att, cor, acc, n, mastery, quiz: qz ? qz.last : null, best: qz ? qz.best : null, tries: qz ? qz.n : 0, minsLeft, days: days.length, last7 };
}
function globalStats() {
  const total = LESSONS.length, done = LESSONS.filter(l => S.done[l.id]).length;
  let m = 0, att = 0, cor = 0; SECS.forEach(s => { const st = secStats(s); m += st.mastery; att += st.att; cor += st.cor; });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0, mastery: SECS.length ? Math.round(m / SECS.length) : 0, acc: att ? Math.round(cor / att * 100) : 0, att };
}

function figHTML(key) {
  const v = VIS[key]; if (!v) return '';
  let body = ''; try { body = typeof v.html === 'function' ? v.html() : (v.html || ''); } catch (e) { console.error(e); }
  return `<figure class="fig" data-vis="${key}" style="margin:0"><div class="fig-head"><b>${v.t}</b>${(v.k || []).map(k => `<span class="chip ${k === '3d' || k === 'anim' ? 'acc' : ''}">${VTYPE[k] || k}</span>`).join('')}</div><div class="fig-body">${body}</div>${v.cap ? `<figcaption class="fig-cap">${v.cap}</figcaption>` : ''}</figure>`;
}
function withFigs(html) { return String(html || '').replace(/\{\{v:([\w-]+)\}\}/g, (_, k) => figHTML(k)); }
let figIO = null;
function mountFigs() {
  if (figIO) figIO.disconnect();
  const figs = $$('.fig[data-vis]', viewEl).filter(f => VIS[f.dataset.vis] && VIS[f.dataset.vis].mount && !f._m);
  if (!figs.length) return;
  const start = f => { if (f._m) return; f._m = 1; try { const c = VIS[f.dataset.vis].mount(f.querySelector('.fig-body'), f); if (typeof c === 'function') cleanups.push(c); } catch (e) { console.error(e); } };
  if (!('IntersectionObserver' in window)) { figs.forEach(start); return; }
  figIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { start(e.target); figIO.unobserve(e.target); } }), { rootMargin: '300px 0px' });
  figs.forEach(f => figIO.observe(f));
  cleanups.push(() => figIO && figIO.disconnect());
}
window.APP_mountFigs = mountFigs;

/* ---------------- shared bits ---------------- */
function ring(p, size = 132, stroke = 11, label = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<div class="score-ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(p, 0, 100) / 100)}"/></svg><div class="ring-in"><b>${bn(Math.round(p))}%</b>${label ? `<br><span>${label}</span>` : ''}</div></div>`;
}
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${clamp(p, 0, 100)}%"></i></div>`;
function listHTML(v) {
  if (!v) return '';
  if (Array.isArray(v)) return `<ul class="pts">${v.map(x => `<li>${x}</li>`).join('')}</ul>`;
  return withFigs(v);
}
function qaHTML(items, prefix = '') {
  return items.map((it, i) => `<div class="qa"><div class="q">${prefix ? `<b>${prefix}${bn(i + 1)}.</b> ` : ''}${it[0]}</div><button class="btn sm soft reveal-btn" data-act="reveal">${ico('eye')}উত্তর দেখো</button><div class="ans" hidden>${it[1]}</div></div>`).join('');
}
function tileHTML(s, extra = '') {
  const st = secStats(s);
  return `<button class="tile cat-${CAT[s.cat][0]} ${st.comp === 1 ? 'done' : ''}" data-act="sec" data-id="${s.id}" ${extra} aria-label="${s.no} ${s.t}"><span class="tn"><span>${s.no}</span><span>${bn(st.mastery)}</span></span><span class="sym">${s.sym}</span><span class="tt">${s.st || s.t}</span><span class="tb"><i style="width:${st.comp * 100}%"></i></span></button>`;
}

const MON = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];

const BTABS = [['mcq', 'MCQ'], ['sq', 'সংক্ষিপ্ত'], ['cq', 'সৃজনশীল'], ['bq', 'বোর্ড ধাঁচ'], ['aq', 'প্রয়োগমূলক'], ['nq', 'বিশ্লেষণধর্মী'], ['hq', 'HOTS'], ['wp', 'লিখিত অনুশীলন']];

function recordQ(id, ok) {

  ${!ok ? `<div class="small" style="margin-top:6px"><b style="display:inline">ভুলের বিশ্লেষণ:</b> তুমি (${OL[pick]}) বেছে নিয়েছ। ${lt ? `ধারণাটি এসেছে <button class="btn ghost sm" style="padding:0 4px;min-height:0;color:var(--accent)" data-act="lesson" data-id="${lt.id}">${lt.no || ''} ${lt.t}</button> পাঠ থেকে — সেখানে আবার চোখ বুলাও।` : 'ব্যাখ্যাটি আরেকবার পড়ে সংশ্লিষ্ট পাঠ পুনরায় দেখো।'}</div>` : ''}</div>`;
}
VIEWS.bank = ({ id, tab = 'mcq', diff = 'all' }) => {

    ${list.map((m, i) => mcqHTML(m, i)).join('') || '<div class="empty">এই কঠিনতায় প্রশ্ন নেই।</div>'}`;

      <button class="btn sm soft reveal-btn" data-act="reveal">${ico('eye')}মডেল উত্তর দেখো</button><div class="ans" hidden>${w[2]}
      ${w[3] ? `<div class="note" style="margin-top:10px"><b>নম্বর বণ্টন:</b> ${w[3]}</div>` : ''}${w[4] ? `<div class="note amb"><b>পরীক্ষকের মন্তব্য:</b> ${w[4]}</div>` : ''}</div></div>`).join('') || '<div class="empty">শীঘ্রই যুক্ত হবে।</div>';

/* ---------- Adaptive quiz ---------- */
let QZ = null;
const LV = ['e', 'm', 'h'];
function startQuiz(sid, mode) {
  let pool;
  if (sid === 'wrong') pool = Object.keys(S.wrong).filter(id => MCQ[id]);
  else { pool = SMAP[sid].allM.slice(); }
  if (mode !== 'adaptive' && LV.includes(mode)) { const f = pool.filter(id => MCQ[id].d === mode); if (f.length >= 3) pool = f; }
  if (!pool.length) { toast('এখানে কোনো প্রশ্ন নেই'); return; }
  QZ = { sid, mode, pool, n: Math.min(10, pool.length), asked: [], answers: [], level: mode === 'adaptive' ? 'm' : null, cur: null, start: Date.now(), qStart: Date.now(), picked: null };
  nextQ();
  go('quiz', { sid });
}
function nextQ() {
  const left = QZ.pool.filter(id => !QZ.asked.includes(id));
  let cand = left;
  if (QZ.level) {
    const order = QZ.level === 'm' ? ['m', 'e', 'h'] : QZ.level === 'h' ? ['h', 'm', 'e'] : ['e', 'm', 'h'];
    for (const lv of order) { const c = left.filter(id => MCQ[id].d === lv); if (c.length) { cand = c; break; } }
  }
  const pickOne = shuffle(cand)[0];
  QZ.cur = pickOne; QZ.asked.push(pickOne); QZ.picked = null; QZ.qStart = Date.now();
}
VIEWS.quiz = () => {
  if (!QZ || !QZ.cur) return VIEWS.practice();
  const m = MCQ[QZ.cur], i = QZ.asked.length;
  const s = SMAP[m.sid];
  const segs = Array.from({ length: QZ.n }, (_, k) => { const a = QZ.answers[k]; return `<i class="${a ? (a.ok ? 'ok' : 'bad') : (k === i - 1 ? 'cur' : '')}"></i>`; }).join('');
  const modeName = QZ.mode === 'adaptive' ? 'অ্যাডাপটিভ' : QZ.mode === 'wrong' ? 'ভুল প্রশ্ন' : DL[QZ.mode];
  return {
    title: 'কুইজ', eye: (QZ.sid === 'wrong' ? 'ভুল প্রশ্ন পুনরায়' : s.no + ' ' + (s.st || s.t)) + ' · ' + modeName, nav: 'practice',
    html: `<div class="wrap stack"><div class="row"><b>প্রশ্ন ${bn(i)}/${bn(QZ.n)}</b><span class="sp"></span>${QZ.level ? `<span class="small muted">বর্তমান স্তর:</span> <span class="chip ${QZ.level}">${DL[QZ.level]}</span>` : ''}<span class="timer" id="qTimer">০:০০</span></div>
    <div class="qprog">${segs}</div>
    ${mcqHTML(m, i - 1, { act: 'qpick', label: (QZ.sid === 'wrong' ? s.no + ' · ' : '') + 'প্রশ্ন ' + bn(i) })}
    <div class="row" id="qNext" hidden><span class="sp"></span><button class="btn primary" data-act="qnext">${i >= QZ.n ? 'ফলাফল দেখো' : 'পরের প্রশ্ন'}${ico('next')}</button></div>
    <button class="btn ghost sm" data-act="qquit" style="align-self:flex-start">কুইজ ছেড়ে দাও</button></div>`,
    after() {
      const t = setInterval(() => { const e = Math.floor((Date.now() - QZ.start) / 1000); const el = $('#qTimer'); if (el) el.textContent = bn(Math.floor(e / 60)) + ':' + bn(String(e % 60).padStart(2, '0')); }, 1000);
      cleanups.push(() => clearInterval(t));
    }
  };
};
function quizPick(btn) {
  if (!QZ || QZ.picked != null) return;
  const m = MCQ[btn.dataset.q], pick = +btn.dataset.i, ok = pick === m.a;
  QZ.picked = pick;
  QZ.answers.push({ id: m.id, pick, ok, d: m.d, t: Date.now() - QZ.qStart });
  recordQ(m.id, ok);
  const card = btn.closest('.qcard');
  $$('.opt', card).forEach((b, k) => { b.disabled = true; if (k === m.a) b.classList.add('right'); if (k === pick && !ok) b.classList.add('wrong'); });
  $('.fb', card).innerHTML = feedbackHTML(m, pick);
  if (QZ.level) { const li = LV.indexOf(QZ.level); QZ.level = LV[clamp(li + (ok ? 1 : -1), 0, 2)]; }
  const n = $('#qNext'); n.hidden = false; n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function finishQuiz() {
  const a = QZ.answers, sc = a.filter(x => x.ok).length, p = Math.round(sc / a.length * 100);
  if (QZ.sid !== 'wrong') {
    const q = S.quiz[QZ.sid] || { n: 0, best: 0, hist: [] };
    q.n++; q.last = p; q.best = Math.max(q.best || 0, p); q.hist = (q.hist || []).concat([[Date.now(), p]]).slice(-12);
    S.quiz[QZ.sid] = q; save();
  }
  QZ.done = { sc, p, time: Date.now() - QZ.start };
  go('quizReport', { sid: QZ.sid }, { replace: true });
}
VIEWS.quizReport = () => {
  if (!QZ || !QZ.done) return VIEWS.practice();
  const a = QZ.answers, { sc, p, time } = QZ.done;
  const byD = LV.map(d => { const x = a.filter(r => r.d === d); return [d, x.length, x.filter(r => r.ok).length]; }).filter(r => r[1]);
  const weak = {};
  a.filter(r => !r.ok).forEach(r => { const m = MCQ[r.id]; const k = m.l || m.sid; weak[k] = (weak[k] || 0) + 1; });
  const weakList = Object.entries(weak).sort((x, y) => y[1] - x[1]);
  const verdict = p >= 85 ? 'চমৎকার! এই অংশে তোমার দখল দৃঢ়।' : p >= 65 ? 'ভালো করেছ। কয়েকটি ধারণা আরেকবার ঝালিয়ে নাও।' : p >= 40 ? 'মাঝামাঝি। নিচের দুর্বল জায়গাগুলো আবার পড়ে আবার কুইজ দাও।' : 'এই অংশটি আবার শুরু থেকে পড়া দরকার। পাঠ শেষে আবার চেষ্টা করো।';
  const s = SMAP[QZ.sid];
  return {
    title: 'কুইজ রিপোর্ট', eye: s ? s.no + ' ' + (s.st || s.t) : 'ভুল প্রশ্ন', nav: 'practice',
    html: `<div class="wrap stack">
    <div class="card row" style="gap:18px;align-items:center">${ring(p, 132, 11, 'স্কোর')}<div style="flex:1;min-width:180px"><h2 class="h-card">পারফরম্যান্স রিপোর্ট</h2><p style="margin:.3em 0">${verdict}</p>
    <div class="small muted">${bn(sc)}/${bn(a.length)} সঠিক · মোট সময় ${bn(Math.round(time / 60000))} মি. ${bn(Math.round(time / 1000) % 60)} সে. · প্রতি প্রশ্নে গড় ${bn(Math.round(time / a.length / 1000))} সে.</div></div></div>
    <div class="card stack" style="gap:10px"><b>কঠিনতা অনুযায়ী</b>${byD.map(([d, n, c]) => `<div><div class="row small"><span class="chip ${d}">${DL[d]}</span><span class="sp"></span>${bn(c)}/${bn(n)}</div>${bar(c / n * 100, d === 'e' ? 'ok' : d === 'm' ? 'a2' : '')}</div>`).join('')}</div>
    <div class="card stack" style="gap:8px"><b>পুনরালোচনার পরামর্শ</b>${weakList.length ? weakList.map(([k, n]) => { const l = LMAP[k]; const sx = SMAP[k]; return l ? `<button class="li" style="border:1px solid var(--line);border-radius:12px" data-act="lesson" data-id="${l.id}"><span class="no">${l.no || ''}</span><span class="t">${l.t}<small>${bn(n)}টি ভুল এই পাঠ থেকে</small></span>${ico('next')}</button>` : sx ? `<button class="li" data-act="sec" data-id="${sx.id}"><span class="t">${sx.t}<small>${bn(n)}টি ভুল</small></span></button>` : ''; }).join('') : '<span class="muted">কোনো ভুল নেই — দারুণ! কঠিন স্তরে আরেকবার চেষ্টা করতে পারো।</span>'}</div>
    <details class="blk"><summary><span class="bi">${ico('list')}</span>সব উত্তর ও ব্যাখ্যা<span class="chev">${ico('chev')}</span></summary><div class="bd stack" style="gap:10px">${a.map((r, k) => { const m = MCQ[r.id]; return `<div class="qa"><div class="q"><b>${bn(k + 1)}.</b> ${m.q} <span class="chip ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'সঠিক' : 'ভুল'}</span></div><div class="small">তোমার উত্তর: (${OL[r.pick]}) ${m.o[r.pick]}${r.ok ? '' : ` · সঠিক: (${OL[m.a]}) ${m.o[m.a]}`}</div>${m.x ? `<div class="small muted">${m.x}</div>` : ''}</div>`; }).join('')}</div></details>
    <div class="row">${QZ.sid !== 'wrong' ? `<button class="btn primary" data-act="quiz" data-id="${QZ.sid}" data-mode="${QZ.mode}">${ico('repeat')}আবার কুইজ</button><button class="btn" data-act="sec" data-id="${QZ.sid}">অংশে ফিরে যাও</button>` : `<button class="btn primary" data-act="quiz" data-id="wrong" data-mode="wrong">${ico('repeat')}বাকি ভুলগুলো আবার</button>`}</div>
    </div>`
  };
};

let FC = null;

  if (!FC || FC.sid !== sid) {
    const order = shuffle(deck).sort((a, b) => (S.fc[a.id] || 0) - (S.fc[b.id] || 0));
    FC = { sid, order, i: 0, flip: false };
  }
  const known = deck.filter(c => (S.fc[c.id] || 0) >= 2).length;
  const c = FC.order[FC.i];
  const opts = `<select class="inp" id="fcDeck"><option value="all">সব অংশ (${bn(SECS.reduce((a, s) => a + s.F.length, 0))})</option>${SECS.filter(s => s.F.length).map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${s.no} ${s.st || s.t} (${bn(s.F.length)})</option>`).join('')}</select>`;

      <div class="face"><small>${SMAP[c.sid].no} · কার্ড ${bn(FC.i + 1)}/${bn(FC.order.length)}</small><div class="fq">${c.f}</div><div class="small muted" style="margin-top:14px">উত্তর দেখতে ট্যাপ করো</div></div>
      <div class="face back"><small>উত্তর</small><div class="fa">${c.b}</div></div></div></div>
    <div class="grid2"><button class="btn" data-act="fcMark" data-k="0">${ico('repeat')}আবার দেখব</button><button class="btn primary" data-act="fcMark" data-k="1">${ico('check')}জানি</button></div>

/* ---------- Search ---------- */
let IDX = null;
function buildIdx() {
  IDX = [];
  LESSONS.forEach(l => { let t = l.t + ' '; BLOCKS.forEach(([k]) => { const v = l[k]; if (v) t += ' ' + (Array.isArray(v) ? v.map(x => Array.isArray(x) ? x.join(' ') : x).join(' ') : v); }); IDX.push({ k: 'l', id: l.id, sid: l.sid, title: (l.no ? l.no + ' ' : '') + l.t, text: strip(t).replace(/\{\{v:[\w-]+\}\}/g, '').replace(/\s+/g, ' ') }); });
  SECS.forEach(s => {
    s.allM.forEach(id => { const m = MCQ[id]; IDX.push({ k: 'q', sid: s.id, tab: 'mcq', title: 'MCQ · ' + s.no, text: strip(m.q + ' ' + m.o.join(' ') + ' ' + m.x).replace(/\s+/g, ' ') }); });
    ['sq', 'bq', 'aq', 'nq', 'hq'].forEach(t => s.Q[t].forEach(q => IDX.push({ k: 'q', sid: s.id, tab: t, title: BTABS.find(b => b[0] === t)[1] + ' · ' + s.no, text: strip(q.join(' ')).replace(/\s+/g, ' ') })));
    s.Q.cq.forEach(c => IDX.push({ k: 'q', sid: s.id, tab: 'cq', title: 'সৃজনশীল · ' + s.no, text: strip(c.s + ' ' + c.p.map(p => p.join(' ')).join(' ')).replace(/\s+/g, ' ') }));
    s.FM.forEach(f => IDX.push({ k: 'f', sid: s.id, title: 'সূত্র · ' + s.no, text: strip(f.join(' ')).replace(/\s+/g, ' ') }));
  });
}
VIEWS.search = ({ q = '' }) => ({
  title: 'খোঁজো', nav: 'tools',
  html: `<div class="wrap stack"><div class="search-box">${ico('search', 'muted')}<input id="sQ" type="search" placeholder="যেমন: বামার, শিখা পরীক্ষা, Rf, আউফবাউ" value="${esc(q)}" autocomplete="off"></div><div id="sRes" class="lesson-list" style="${q ? '' : 'display:none'}"></div><div id="sHint" class="small muted">পাঠ, প্রশ্ন ও সূত্র — সবখানে খোঁজা হবে।</div></div>`,
  after() { const i = $('#sQ'); const run = () => { cur.args.q = i.value; doSearch(i.value); }; i.addEventListener('input', run); if (q) run(); setTimeout(() => i.focus(), 50); }
});
function doSearch(q) {
  if (!IDX) buildIdx();
  q = q.trim(); const box = $('#sRes'), hint = $('#sHint');
  if (q.length < 2) { box.style.display = 'none'; hint.textContent = 'অন্তত ২টি অক্ষর লেখো।'; return; }
  const ql = q.toLowerCase(); const res = [];
  for (const e of IDX) { const p = e.text.toLowerCase().indexOf(ql); if (p >= 0 || e.title.toLowerCase().includes(ql)) res.push([e, p]); if (res.length > 80) break; }
  hint.textContent = res.length ? bn(res.length) + 'টি ফলাফল' : 'কিছু পাওয়া যায়নি। অন্য শব্দে চেষ্টা করো।';
  box.style.display = res.length ? '' : 'none';
  box.innerHTML = res.map(([e, p]) => {
    const a = Math.max(0, p - 50), snip = p >= 0 ? (a > 0 ? '…' : '') + esc(e.text.slice(a, p)) + '<mark>' + esc(e.text.slice(p, p + q.length)) + '</mark>' + esc(e.text.slice(p + q.length, p + q.length + 70)) + '…' : '';
    const act = e.k === 'l' ? `data-act="lesson" data-id="${e.id}" data-find="${esc(q)}"` : e.k === 'f' ? `data-act="go" data-v="formulas" data-q="${esc(q)}"` : `data-act="bank" data-id="${e.sid}" data-tab="${e.tab}"`;
    return `<button class="res" ${act}><small>${e.k === 'l' ? 'পাঠ' : ''} ${e.title}</small>${e.k === 'l' ? `<b>${LMAP[e.id].t}</b>` : ''}<p>${snip}</p></button>`;
  }).join('');
}

function computeMega() {
  const R = S.megaRun; const parts = {}; let wsum = 0, ssum = 0;
  MEGA_PARTS.forEach(([k, , , , w]) => { if (R[k].done) { const sc = partScore(k); parts[k] = Math.round(sc * 100); wsum += w; ssum += w * sc; } });
  const mastery = wsum ? Math.round(ssum / wsum * 100) : 0;
  const bySec = {};
  const add = (sid, got, max) => { const b = bySec[sid] || (bySec[sid] = [0, 0]); b[0] += got; b[1] += max; };
  if (R.A.done) R.A.items.forEach(id => add(MCQ[id].sid, R.A.ans[id] === MCQ[id].a ? 1 : 0, 1));
  if (R.B.done) R.B.items.forEach(([sid, i]) => add(sid, R.B.marks[sid + ':' + i] || 0, 1));
  if (R.D.done) R.D.items.forEach(([sid, i]) => add(sid, R.D.marks[sid + ':' + i] || 0, 1));
  if (R.C.done) R.C.items.forEach(([sid, i]) => { let g = 0; for (let j = 0; j < 4; j++) g += R.C.marks[sid + ':' + i + ':' + j] || 0; add(sid, g / 10 * 2, 2); });
  if (R.E.done) R.E.items.forEach(set => set.forEach(([sid, i]) => add(sid, R.E.marks[sid + ':' + i] || 0, 1)));
  const secPct = Object.entries(bySec).filter(([, b]) => b[1] > 0).map(([sid, b]) => [sid, Math.round(b[0] / b[1] * 100), b[1]]).sort((a, b) => a[1] - b[1]);
  const weak = secPct.filter(x => x[1] < 60);
  const hardIds = R.A.done ? R.A.items.filter(id => MCQ[id].d === 'h') : [];
  const hardAcc = hardIds.length ? hardIds.filter(id => R.A.ans[id] === MCQ[id].a).length / hardIds.length : (mastery / 100);
  const g = globalStats();
  const consistency = Math.min(1, daysActive(14) / 10);
  const lq = Math.round(100 * (0.35 * mastery / 100 + 0.25 * g.done / Math.max(1, g.total) + 0.15 * consistency + 0.25 * hardAcc));
  const planSrc = (weak.length ? weak : secPct.slice(0, 3)).slice(0, 6);
  const plan = planSrc.map(([sid, p]) => { const s = SMAP[sid]; const st = secStats(s); return { sid, p, lessons: s.L.filter(l => !S.done[l.id]).length || s.L.length, mins: Math.max(20, st.minsLeft || s.L.reduce((a, l) => a + readMin(l), 0)) }; });
  S.mega = { at: Date.now(), parts, mastery, lq, secPct, weak: weak.map(w => w[0]), plan, hardAcc: Math.round(hardAcc * 100) };
  save();
}

    <div class="card stack" style="gap:10px"><b>অংশভিত্তিক স্কোর</b>${MEGA_PARTS.map(([k, n]) => M.parts[k] == null ? `<div class="row small"><span>${k}. ${n}</span><span class="sp"></span><span class="muted">জমা হয়নি</span></div>` : `<div><div class="row small"><span>${k}. ${n}</span><span class="sp"></span><b>${bn(M.parts[k])}%</b></div>${bar(M.parts[k], M.parts[k] >= 60 ? 'ok' : 'a2')}</div>`).join('')}</div>
    <div class="card stack" style="gap:10px"><b>দুর্বল বিষয় নির্ণয়</b>${M.secPct.length ? M.secPct.map(([sid, p]) => `<div><div class="row small"><span>${SMAP[sid].no} ${SMAP[sid].st || SMAP[sid].t}</span><span class="sp"></span><span class="chip ${p < 60 ? 'bad' : p < 80 ? 'warn' : 'ok'}">${bn(p)}%</span></div>${bar(p, p < 60 ? '' : 'ok')}</div>`).join('') : '<span class="muted">মূল্যায়নের তথ্য নেই।</span>'}</div>
    <div class="card stack" style="gap:8px"><b>ব্যক্তিগত রিভিশন পরিকল্পনা</b><p class="small muted" style="margin:0">${M.weak.length ? 'যে অংশে ৬০%-এর কম পেয়েছ সেগুলো আগে।' : 'কোনো অংশ ৬০%-এর নিচে নেই — তুলনামূলক কম স্কোরের অংশ দিয়ে পরিকল্পনা।'} প্রতিদিন একটি অংশ।</p>
    <ol class="steps" style="margin:0">${M.plan.map((p, k) => { const s = SMAP[p.sid]; return `<li><b>দিন ${bn(k + 1)} — ${s.no} ${s.t}</b> (বর্তমান ${bn(p.p)}%)<br><span class="small">১) ${bn(s.L.length)}টি পাঠের "সংক্ষিপ্ত নোট" ও "সাধারণ ভুল" পড়ো (~${bn(Math.min(p.mins, 60))} মি.) · ২) ফর্মুলা শিটের সূত্রগুলো খাতায় লেখো · ৩) প্রশ্নব্যাংকের সৃজনশীল প্রশ্ন ১টি লিখে মিলাও · ৪) অ্যাডাপটিভ কুইজে ৮০%+ লক্ষ্য</span><br><button class="btn sm soft" style="margin-top:6px" data-act="sec" data-id="${s.id}">অংশটি খোলো</button></li>`; }).join('')}<li><b>দিন ${bn(M.plan.length + 1)} — মিশ্র রিভিশন</b><br><span class="small">রিভিশন মোড পড়ো, ভুল প্রশ্নগুলো আবার করো, তারপর নতুন মেগা টেস্ট দাও।</span></li></ol></div>
    <div class="grid2"><button class="btn" data-act="go" data-v="mega">মেগা টেস্টে ফিরে যাও</button><button class="btn primary" data-act="go" data-v="revision">রিভিশন মোড</button></div></div>`
  };
};

/* ---------------- highlights ---------------- */
function textNodesIn(root) {
  const out = []; const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) { const p = n.parentNode; if (!p || !p.closest) return NodeFilter.FILTER_REJECT; if (p.closest('svg,script,style,textarea,button,.fig,.ans,summary,select')) return NodeFilter.FILTER_REJECT; return n.nodeValue.length ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
  });
  let n; while ((n = w.nextNode())) out.push(n); return out;
}
function findAndWrap(root, needle, cls) {
  const norm = String(needle).replace(/\s+/g, ' ').trim(); if (!norm || !root) return null;
  const nodes = textNodesIn(root); let flat = ''; const map = []; let ps = false;
  nodes.forEach((n, ni) => { const v = n.nodeValue; for (let k = 0; k < v.length; k++) { const sp = /\s/.test(v[k]); if (sp) { if (ps) continue; flat += ' '; ps = true; } else { flat += v[k]; ps = false; } map.push([ni, k]); } });
  let idx = flat.indexOf(norm);
  if (idx < 0) idx = flat.toLowerCase().indexOf(norm.toLowerCase());
  if (idx < 0) return null;
  const parts = new Map();
  for (let i = idx; i < idx + norm.length; i++) { const [ni, k] = map[i]; const p = parts.get(ni); if (!p) parts.set(ni, [k, k]); else p[1] = k; }
  let first = null;
  for (const [ni, [a, b]] of parts) { const node = nodes[ni]; try { const r = document.createRange(); r.setStart(node, a); r.setEnd(node, b + 1); const m = document.createElement('mark'); m.className = cls; m.dataset.hl = needle; r.surroundContents(m); if (!first) first = m; } catch (e) { } }
  return first;
}
let hlMode = null;
function hideHl() { $('#hlbar').hidden = true; hlMode = null; }
document.addEventListener('selectionchange', () => {
  clearTimeout(hideHl._t);
  hideHl._t = setTimeout(() => {
    const body = $('#lessonBody'); const sel = getSelection();
    if (!body || !sel || sel.isCollapsed) { if (hlMode && hlMode.type === 'add') hideHl(); return; }
    const t = sel.toString().trim();
    if (t.length < 2 || t.length > 600 || !body.contains(sel.anchorNode) || !body.contains(sel.focusNode)) { if (hlMode && hlMode.type === 'add') hideHl(); return; }
    hlMode = { type: 'add', text: t, id: body.dataset.id };
    $('#hlIn').innerHTML = `<button data-act="hlAdd"><span class="sw"></span>হাইলাইট করো</button><button data-act="hlCancel">${ico('x')}</button>`;
    $('#hlbar').hidden = false;
  }, 180);
});

/* ---------------- actions ---------------- */
const ACT = {
  back: () => back(), drawer: () => toggleDrawer(),
  djToggle: b => b.parentNode.classList.toggle('open'),
  go: b => { const a = {}; if (b.dataset.sid) a.sid = b.dataset.sid; if (b.dataset.q) a.q = b.dataset.q; if (b.dataset.v === 'flash' && a.sid !== (FC && FC.sid)) FC = null; go(b.dataset.v, a); },
  sec: b => go('section', { sid: b.dataset.id }),
  lesson: b => go('lesson', { id: b.dataset.id, find: b.dataset.find }),
  bank: b => go('bank', { id: b.dataset.id, tab: b.dataset.tab || 'mcq' }),
  bankTab: b => { cur.args.tab = b.dataset.tab; cur.args.diff = 'all'; render(); },
  bankDiff: b => { cur.args.diff = b.dataset.d; render(true); },
  libTab: b => { cur.args.tab = b.dataset.tab; render(); },
  reveal: b => { const a = b.nextElementSibling; a.hidden = !a.hidden; b.innerHTML = a.hidden ? ico('eye') + (b.textContent.includes('মডেল') ? 'মডেল উত্তর দেখো' : 'উত্তর দেখো') : ico('x') + 'উত্তর লুকাও'; if (!a.hidden) mountFigsIn(a); },
  bm: b => { const id = b.dataset.id; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = Date.now(); save(); render(true); toast(S.bm[id] ? 'বুকমার্ক করা হলো' : 'বুকমার্ক সরানো হলো'); },
  done: b => {
    const id = b.dataset.id, l = LMAP[id];
    if (S.done[id]) { delete S.done[id]; save(); render(true); toast('অসম্পন্ন হিসেবে চিহ্নিত'); return; }
    S.done[id] = Date.now(); touch('l', l.sid);
    const nx = LESSONS[l.gi + 1];
    render(true);
    const td = S.days[dkey()];
    const goalMsg = td.l === S.goal.l ? ' আজকের লক্ষ্য পূরণ!' : '';
    toast('পাঠ সম্পন্ন!' + goalMsg, nx ? 'পরের পাঠ' : null, () => nx && go('lesson', { id: nx.id }));
  },
  pmcq: b => {
    const card = b.closest('.qcard'); if (card.dataset.done) return; card.dataset.done = 1;
    const m = MCQ[b.dataset.q], pick = +b.dataset.i, ok = pick === m.a;
    recordQ(m.id, ok);
    $$('.opt', card).forEach((x, k) => { x.disabled = true; if (k === m.a) x.classList.add('right'); if (k === pick && !ok) x.classList.add('wrong'); });
    $('.fb', card).innerHTML = feedbackHTML(m, pick);
    if (card.closest('#lx')) exScore();
  },
  quiz: b => startQuiz(b.dataset.id, b.dataset.mode || 'adaptive'),
  qpick: b => quizPick(b),
  qnext: () => { if (QZ.asked.length >= QZ.n) finishQuiz(); else { nextQ(); render(); } },
  qquit: () => { QZ = null; back(); },
  fcFlip: () => { FC.flip = !FC.flip; $('#flashCard').classList.toggle('flip', FC.flip); },
  fcMark: b => { const c = FC.order[FC.i]; if (!c) return; S.fc[c.id] = b.dataset.k === '1' ? Math.min(3, (S.fc[c.id] || 0) + 1) : 0; touch('q', c.sid, 0.5); FC.i = (FC.i + 1) % FC.order.length; FC.flip = false; render(true); },
  fcStep: b => { FC.i = (FC.i + +b.dataset.d + FC.order.length) % FC.order.length; FC.flip = false; render(true); },
  fcShuffle: () => { FC.order = shuffle(FC.order); FC.i = 0; FC.flip = false; render(true); },
  goal: b => { const k = b.dataset.k; S.goal[k] = clamp(S.goal[k] + +b.dataset.d, k === 'l' ? 1 : 5, k === 'l' ? 15 : 240); save(); render(true); },
  theme: b => { S.theme = b.dataset.k; save(); applyTheme(); $$('.theme-opt').forEach(x => x.classList.toggle('on', x.dataset.k === S.theme)); },
  themeSheet: () => openSheet(`<h2 class="h-card" style="margin-bottom:10px">থিম বেছে নাও</h2>${themeOpts()}<button class="btn block" style="margin-top:12px" data-act="closeSheet">ঠিক আছে</button>`),
  closeSheet: () => closeSheet(),
  reset: b => {
    if (!b.dataset.arm) { b.dataset.arm = 1; b.innerHTML = ico('alert') + 'নিশ্চিত? আবার চাপলে সব মুছে যাবে'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.innerHTML = ico('trash') + 'সব অগ্রগতি মুছো'; } }, 5000); return; }
    const th = S.theme; S = DEF(); S.theme = th; save(); toast('সব অগ্রগতি মুছে ফেলা হয়েছে'); go('home', {}, { replace: true });
  },
  hlAdd: () => { if (!hlMode) return; const { text, id } = hlMode; (S.hl[id] || (S.hl[id] = [])).push(text); save(); const body = $('#lessonBody'); findAndWrap(body, text, 'hl'); try { getSelection().removeAllRanges(); } catch (e) { } hideHl(); toast('হাইলাইট সংরক্ষিত'); },
  hlCancel: () => { try { getSelection().removeAllRanges(); } catch (e) { } hideHl(); },
  hlRemove: () => { if (!hlMode) return; const arr = S.hl[hlMode.id] || []; const i = arr.indexOf(hlMode.text); if (i >= 0) arr.splice(i, 1); save(); hideHl(); render(true); toast('হাইলাইট মুছে ফেলা হলো'); },
  hlDel: b => { const arr = S.hl[b.dataset.id] || []; arr.splice(+b.dataset.i, 1); save(); render(true); },
  megaNew: () => { newMega(); render(); },
  megaReset: b => { if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'নিশ্চিত? আবার চাপো'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.innerHTML = ico('repeat') + 'নতুন টেস্ট'; } }, 4000); return; } newMega(); render(); toast('নতুন প্রশ্ন দিয়ে মেগা টেস্ট তৈরি হলো'); },
  megaPart: b => { const p = b.dataset.p; if (p === 'A') go('megaA'); else go('megaSelf', { p }); },
  megaPick: b => { const R = S.megaRun.A; R.ans[R.items[R.i]] = +b.dataset.i; save({ cloud: false }); if (R.i < R.items.length - 1) { setTimeout(() => { R.i++; render(); }, 160); } else render(true); },
  megaStep: b => { const R = S.megaRun.A; R.i = clamp(R.i + +b.dataset.d, 0, R.items.length - 1); save({ cloud: false }); render(); },
  megaJump: b => { S.megaRun.A.i = +b.dataset.i; render(); },
  megaSubmitA: b => {
    const R = S.megaRun.A; const un = R.items.length - Object.keys(R.ans).length;
    if (un > 0 && !b.dataset.arm) { b.dataset.arm = 1; b.textContent = bn(un) + 'টি উত্তর বাকি — তবুও জমা দিতে আবার চাপো'; return; }
    R.done = true; R.items.forEach(id => { if (R.ans[id] != null) recordQ(id, R.ans[id] === MCQ[id].a); }); save(); toast('MCQ অংশ জমা হয়েছে · স্কোর ' + bn(Math.round(partScore('A') * 100)) + '%'); go('mega', {}, { replace: true });
  },
  megaMark: b => { const R = S.megaRun[b.dataset.p]; R.marks[b.dataset.key] = +b.dataset.v; save({ cloud: false }); $$('button', b.parentNode).forEach(x => x.classList.toggle('on', x === b)); },
  megaSubmitSelf: b => { const R = S.megaRun[b.dataset.p]; R.done = true; save(); toast('অংশ ' + b.dataset.p + ' জমা হয়েছে'); go('mega', {}, { replace: true }); },
  megaFinish: () => { computeMega(); go('megaReport'); }
};
function mountFigsIn(el) { mountFigs(); }
document.addEventListener('click', e => {
  const m = e.target.closest('mark.hl');
  if (m && m.closest('#lessonBody') && getSelection().isCollapsed) {
    hlMode = { type: 'rm', text: m.dataset.hl, id: $('#lessonBody').dataset.id };
    $('#hlIn').innerHTML = `<button data-act="hlRemove">${ico('trash')}হাইলাইট মুছো</button><button data-act="hlCancel">${ico('x')}</button>`;
    $('#hlbar').hidden = false; return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); }
});
$('#hlbar').addEventListener('mousedown', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'flashCard') { e.preventDefault(); ACT.fcFlip(); }
  if (e.key === 'Escape') { closeSheet(); toggleDrawer(false); hideHl(); }
});

/* ---------------- boot ---------------- */
applyTheme();
let bootName = 'home', bootArgs = {};
const hash = (location.hash || '').slice(1);
if (hash && LMAP[hash]) { bootName = 'lesson'; bootArgs = { id: hash }; }
else if (hash && SMAP[hash]) { bootName = 'section'; bootArgs = { sid: hash }; }
else if (S.last && S.last.name && VIEWS[S.last.name] && ((S.last.args.id && (LMAP[S.last.args.id] || SMAP[S.last.args.id])) || SMAP[S.last.args.sid])) {
  bootName = S.last.name; bootArgs = Object.assign({}, S.last.args, { y: S.last.y || 0 });
}
if (bootName !== 'home') { stack.push({ name: 'home', args: {} }); }
cur = { name: bootName, args: bootArgs };
render(false, true);
if (bootName !== 'home' && !hash) {
  const y = bootArgs.y || 0;
  setTimeout(() => { if (y) window.scrollTo(0, y); }, 350);
  setTimeout(() => toast('যেখানে থেমেছিলে সেখান থেকে শুরু হলো', 'হোমে যাও', () => { stack.length = 0; go('home', {}, { replace: true }); }), 500);
}
if (TOP) { try { history.replaceState({ d: 0 }, ''); } catch (e) { } }
renderDrawer();
syncBadge();
cloud.init();
window.APP = { S: () => S, go, LMAP, SMAP, MCQ, LESSONS };
})();
</script>
