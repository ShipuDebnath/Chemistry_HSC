<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HSC গুণগত রসায়ন</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFDF8">
<meta name="description" content="HSC রসায়ন ১ম পত্র, অধ্যায় ২: গুণগত রসায়ন — সম্পূর্ণ ইন্টারঅ্যাকটিভ স্টাডি অ্যাপ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* Layout: "chapter as a periodic table" — section tiles on home, a calm lab-notebook reading column for lessons.
   Accent = Prussian blue (the Fe³⁺ test colour); secondary = sodium-flame amber. */
:root{
  --bg:#F7F3EA; --surface:#FFFDF8; --surface-2:#EFE8DA; --surface-3:#E6DDCB;
  --fg:#1F1C16; --muted:#6A6253; --line:#E2D8C6; --line-strong:#CDBFA6;
  --accent:#1F4E8C; --accent-soft:#DCE6F3; --accent-ink:#FFFFFF;
  --accent-2:#A86400; --accent-2-soft:#F6E7CC;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#F7DEDB; --warn:#995A00; --warn-soft:#F8EBD3;
  --hl:#FFE27A; --hl-fg:#1F1C16;
  --cat-a:#3466A8; --cat-b:#7E48AE; --cat-c:#17806F; --cat-d:#A85A22; --cat-e:#5E6673;
  --spec-bg:#16131D; --spec-fg:#F3EEFF;
  --shadow:0 1px 2px rgba(48,36,12,.06),0 6px 20px rgba(48,36,12,.07);
  --radius:14px; --radius-sm:9px;
  --font-display:'Tiro Bangla','Noto Serif Bengali','Kohinoor Bangla',serif;
  --font-body:'Anek Bangla','Noto Sans Bengali','Hind Siliguri','Kohinoor Bangla','Bangla Sangam MN','Nirmala UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --nav-h:62px; --top-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F13; --surface:#16181E; --surface-2:#1D2028; --surface-3:#262A34;
    --fg:#E8EAF0; --muted:#9BA1AE; --line:#2A2E39; --line-strong:#3A3F4C;
    --accent:#8DB6FF; --accent-soft:#1D2A44; --accent-ink:#0B1222;
    --accent-2:#FFB65C; --accent-2-soft:#3A2B17;
    --ok:#5CCB8A; --ok-soft:#173225; --bad:#FF8A80; --bad-soft:#3B1C1A; --warn:#F2B35B; --warn-soft:#3A2A14;
    --hl:#6B5A12; --hl-fg:#FFF6D6;
    --cat-a:#7EA8F0; --cat-b:#B98AE6; --cat-c:#4FC9B3; --cat-d:#F0A06A; --cat-e:#A3ABB8;
    --spec-bg:#0A090E; --spec-fg:#F3EEFF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F13; --surface:#16181E; --surface-2:#1D2028; --surface-3:#262A34;
  --fg:#E8EAF0; --muted:#9BA1AE; --line:#2A2E39; --line-strong:#3A3F4C;
  --accent:#8DB6FF; --accent-soft:#1D2A44; --accent-ink:#0B1222;
  --accent-2:#FFB65C; --accent-2-soft:#3A2B17;
  --ok:#5CCB8A; --ok-soft:#173225; --bad:#FF8A80; --bad-soft:#3B1C1A; --warn:#F2B35B; --warn-soft:#3A2A14;
  --hl:#6B5A12; --hl-fg:#FFF6D6;
  --cat-a:#7EA8F0; --cat-b:#B98AE6; --cat-c:#4FC9B3; --cat-d:#F0A06A; --cat-e:#A3ABB8;
  --spec-bg:#0A090E; --spec-fg:#F3EEFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* ---- Explicit skins chosen inside the app (override viewer theme) ---- */
html:root[data-skin="vanilla"]{
  --bg:#F7F3EA; --surface:#FFFDF8; --surface-2:#EFE8DA; --surface-3:#E6DDCB;
  --fg:#1F1C16; --muted:#6A6253; --line:#E2D8C6; --line-strong:#CDBFA6;
  --accent:#1F4E8C; --accent-soft:#DCE6F3; --accent-ink:#FFFFFF;
  --accent-2:#A86400; --accent-2-soft:#F6E7CC;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#F7DEDB; --warn:#995A00; --warn-soft:#F8EBD3;
  --hl:#FFE27A; --hl-fg:#1F1C16;
  --cat-a:#3466A8; --cat-b:#7E48AE; --cat-c:#17806F; --cat-d:#A85A22; --cat-e:#5E6673;
  --spec-bg:#16131D; --shadow:0 1px 2px rgba(48,36,12,.06),0 6px 20px rgba(48,36,12,.07);
  color-scheme:light;
}
html:root[data-skin="forest"]{
  --bg:#0D1712; --surface:#132219; --surface-2:#1A2D21; --surface-3:#22392B;
  --fg:#E2ECE3; --muted:#98B09F; --line:#24392C; --line-strong:#33503E;
  --accent:#74D39C; --accent-soft:#1B3A28; --accent-ink:#06150C;
  --accent-2:#E8C55E; --accent-2-soft:#38311A;
  --ok:#74D39C; --ok-soft:#183626; --bad:#FF8F84; --bad-soft:#3A1E1B; --warn:#E8C55E; --warn-soft:#352E17;
  --hl:#5A5A16; --hl-fg:#FCFBE0;
  --cat-a:#7FB6E8; --cat-b:#C29BE8; --cat-c:#6FD3B9; --cat-d:#E9A86F; --cat-e:#A6B5AA;
  --spec-bg:#07100B; --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html:root[data-skin="ocean"]{
  --bg:#EDF5F7; --surface:#FFFFFF; --surface-2:#E0EDF1; --surface-3:#D0E3E9;
  --fg:#0F252C; --muted:#4F6A73; --line:#CFE0E5; --line-strong:#AFCAD2;
  --accent:#0B6E8A; --accent-soft:#D3ECF3; --accent-ink:#FFFFFF;
  --accent-2:#C0430D; --accent-2-soft:#FBE3D6;
  --ok:#14794A; --ok-soft:#D7F0E3; --bad:#B42318; --bad-soft:#FBE1DE; --warn:#9A5B00; --warn-soft:#FAEBD0;
  --hl:#FFE680; --hl-fg:#0F252C;
  --cat-a:#2563A6; --cat-b:#7646A8; --cat-c:#0E7F72; --cat-d:#B0561B; --cat-e:#566772;
  --spec-bg:#0C1A20; --shadow:0 1px 2px rgba(8,50,64,.06),0 6px 20px rgba(8,50,64,.08);
  color-scheme:light;
}
html:root[data-skin="dark"]{
  --bg:#0E0F13; --surface:#16181E; --surface-2:#1D2028; --surface-3:#262A34;
  --fg:#E8EAF0; --muted:#9BA1AE; --line:#2A2E39; --line-strong:#3A3F4C;
  --accent:#8DB6FF; --accent-soft:#1D2A44; --accent-ink:#0B1222;
  --accent-2:#FFB65C; --accent-2-soft:#3A2B17;
  --ok:#5CCB8A; --ok-soft:#173225; --bad:#FF8A80; --bad-soft:#3B1C1A; --warn:#F2B35B; --warn-soft:#3A2A14;
  --hl:#6B5A12; --hl-fg:#FFF6D6;
  --cat-a:#7EA8F0; --cat-b:#B98AE6; --cat-c:#4FC9B3; --cat-d:#F0A06A; --cat-e:#A3ABB8;
  --spec-bg:#0A090E; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drawln{to{stroke-dashoffset:0}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0 0 .75em}
sub,sup{font-size:.72em;line-height:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;min-height:var(--top-h);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;padding:0 4px}
.tb-title small{font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title strong{font-family:var(--font-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-inline-end:6px;vertical-align:middle}
.sync-dot.cloud{background:var(--ok)}
.readbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:49;height:3px;background:transparent}
.readbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}

/* ---------- Layout ---------- */
.shell{display:block}
.main{min-height:60vh;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sp{flex:1}

/* ---------- Drawer / sidebar ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:71;top:0;bottom:0;left:0;width:min(88vw,340px);background:var(--surface);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer.on{transform:none}
.drawer-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:19px}
.drawer-body{overflow-y:auto;flex:1;padding:8px 8px 24px;overscroll-behavior:contain}
.dj-sec{border-radius:10px}
.dj-sec>button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px}
.dj-sec>button:hover{background:var(--surface-2)}
.dj-no{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:34px}
.dj-t{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.dj-pct{font-size:12px;color:var(--muted)}
.dj-lessons{padding:0 0 6px 44px;display:none}
.dj-sec.open .dj-lessons{display:block}
.dj-lessons button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:13.5px;line-height:1.4;color:var(--fg)}
.dj-lessons button:hover{background:var(--surface-2)}
.dj-lessons .ck{flex:none;margin-top:3px}
.ck{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-block}
.ck.on{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}

/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bottomnav button{border:0;background:transparent;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.on{color:var(--accent)}
.bottomnav button.on span{font-weight:600}

@media (min-width:1080px){
  .shell{display:grid;grid-template-columns:320px minmax(0,1fr)}
  .drawer{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));height:calc(100vh - var(--top-h) - env(safe-area-inset-top,0px));transform:none;width:auto;z-index:1}
  .scrim{display:none}
  #btnMenu{display:none}
  .main{padding-bottom:40px}
  .bottomnav{position:sticky;top:auto;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:14px;margin:0 8px 8px;bottom:8px}
}

/* ---------- Generic UI ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.h-display{font-size:clamp(26px,6.4vw,34px)}
.h-sec{font-size:clamp(21px,5vw,26px)}
.h-card{font-size:19px}
.lead{font-size:16.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--fg);padding:10px 16px;border-radius:12px;font-size:15px;line-height:1.2;min-height:44px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.e{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.m{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.h{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.bar.ok>i{background:var(--ok)} .bar.a2>i{background:var(--accent-2)}
.bar.thin{height:5px}
.divider{height:1px;background:var(--line);margin:4px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.stars{color:var(--accent-2);letter-spacing:2px;font-size:14px}

/* ---------- Home ---------- */
.hello{display:flex;flex-direction:column;gap:4px}
.hello .date{font-size:13px;color:var(--muted)}
.spectrum{position:relative;background:var(--spec-bg);color:var(--spec-fg);border-radius:var(--radius);padding:16px 16px 14px;overflow:hidden}
.spectrum .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.spectrum .pct{font-family:var(--font-display);font-size:44px;line-height:1}
.spectrum .lbl{font-size:13px;opacity:.78}
.spec-track{position:relative;height:30px;margin-top:12px;border-radius:6px;overflow:hidden;
  background:linear-gradient(90deg,#3b0a5e 0%,#3b2db8 9%,#1f6fe0 20%,#11a7c9 30%,#1fb35a 42%,#a8d61f 52%,#f5e313 58%,#f9a21a 66%,#f0461b 78%,#b3091d 92%,#4a0510 100%)}
.spec-track .veil{position:absolute;top:0;bottom:0;right:0;background:rgba(10,8,14,.86);transition:left .8s ease}
.spec-track .ln{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75);mix-blend-mode:screen}
.spec-axis{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:5px;font-family:var(--font-mono)}
.stat-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1}
.mini span{font-size:12.5px;color:var(--muted);line-height:1.3}
.mini>svg{width:18px;height:18px;color:var(--accent-2)}
.resume{display:flex;gap:14px;align-items:center}
.resume .ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.resume .ico svg{width:24px;height:24px}
.resume .txt{flex:1;min-width:0}
.resume .txt b{display:block;font-weight:600;line-height:1.35}
.resume>svg{width:22px;height:22px;flex:none;color:var(--muted)}
.resume .txt>span{display:block}

.ptable-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:760px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{--c:var(--cat-a);position:relative;border:1px solid color-mix(in srgb,var(--c) 38%,var(--line));
  background:var(--surface);background:color-mix(in srgb,var(--c) 9%,var(--surface));
  border-radius:10px;padding:7px 8px 9px;text-align:left;display:flex;flex-direction:column;min-height:112px;color:var(--fg);transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile .tn{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.tile .sym{font-family:var(--font-display);font-size:30px;line-height:1.05;color:var(--c);margin-top:4px}
.tile .tt{font-size:12px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tile .tb{height:4px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,var(--surface-3));margin-top:6px;overflow:hidden}
.tile .tb i{display:block;height:100%;background:var(--c)}
.tile.done::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.cat-a{--c:var(--cat-a)} .cat-b{--c:var(--cat-b)} .cat-c{--c:var(--cat-c)} .cat-d{--c:var(--cat-d)} .cat-e{--c:var(--cat-e)}

  ov: `<p>১৯০৯–১৯১১ সালে আর্নেস্ট রাদারফোর্ড (সহকারী গাইগার ও মার্সডেন) একটি খুব পাতলা স্বর্ণপাতের উপর দ্রুতগামী <b>আলফা কণা (He²⁺)</b> ছোড়েন। তিনি দেখলেন — প্রায় সব কণা সোজা বেরিয়ে যায়, কিছু সামান্য বেঁকে যায় আর খুব অল্প কয়েকটি প্রায় উল্টো দিকে ফিরে আসে। এ থেকেই জানা গেল পরমাণুর কেন্দ্রে খুব ছোট, ভারী, ধনাত্মক একটি অংশ আছে — <b>নিউক্লিয়াস</b>।</p>`,
  dp: `<h4>যন্ত্রপাতি ও কার্যপ্রণালি</h4><ol class="steps"><li><b>আলফা উৎস:</b> সীসার বাক্সে রাখা তেজস্ক্রিয় পোলোনিয়াম (বা রেডিয়াম) থেকে আলফা কণা নির্গত হয়। সীসা অন্য দিকের বিকিরণ শোষণ করে।</li><li><b>সরু রশ্মি তৈরি:</b> ছিদ্রযুক্ত সীসার পাতের মধ্য দিয়ে পাঠিয়ে আলফা কণার একটি সরু সমান্তরাল রশ্মি তৈরি করা হয়।</li><li><b>লক্ষ্যবস্তু:</b> রশ্মিটি প্রায় ০.০০০০৪ সেমি (৪×১০⁻⁵ সেমি) পুরু স্বর্ণপাতে আঘাত করে।</li><li><b>শনাক্তকরণ:</b> স্বর্ণপাতের চারদিকে জিংক সালফাইড (ZnS) প্রলেপযুক্ত বৃত্তাকার পর্দা থাকে। প্রতিটি আলফা কণা পর্দায় পড়লে ক্ষুদ্র আলোর ঝলক (সিন্টিলেশন) দেখা যায়, যা ঘোরানো যায় এমন অণুবীক্ষণ যন্ত্রে গণনা করা হয়।</li><li>পুরো ব্যবস্থাটি বায়ুশূন্য প্রকোষ্ঠে রাখা হয়, যাতে বাতাসের অণুর সাথে সংঘর্ষে আলফা কণা বিচ্যুত না হয়।</li></ol>

  <tr><td>২. অল্প কিছু কণা ছোট-বড় বিভিন্ন কোণে বেঁকে যায়।</td><td>পরমাণুর কেন্দ্রে ধনাত্মক চার্জযুক্ত একটি অংশ আছে, যার কাছ দিয়ে যাওয়ার সময় ধনাত্মক আলফা কণা বিকর্ষিত হয়।</td></tr>
  <tr><td>৩. খুবই কম কণা (প্রায় ২০,০০০-এ ১টি) ৯০°-এর বেশি কোণে, প্রায় ১৮০° ঘুরে ফিরে আসে।</td><td>কেন্দ্রের অংশটি অত্যন্ত ক্ষুদ্র, ঘন ও ভারী — পরমাণুর প্রায় সমস্ত ভর এখানে কেন্দ্রীভূত। এর নাম <b>নিউক্লিয়াস</b>।</td></tr>
  </tbody></table></div>
  <p>খুব কম কণা ফিরে আসে — এ থেকে বোঝা যায় নিউক্লিয়াস পরমাণুর তুলনায় অতি ক্ষুদ্র। রাদারফোর্ডের হিসাবে নিউক্লিয়াসের ব্যাসার্ধ প্রায় ১০⁻¹³ সেমি (১০⁻¹⁵ মি), আর পরমাণুর ব্যাসার্ধ প্রায় ১০⁻⁸ সেমি (১০⁻¹⁰ মি)। অর্থাৎ পরমাণু নিউক্লিয়াসের চেয়ে প্রায় <b>১০⁵ গুণ বড়</b> (আয়তনে প্রায় ১০¹⁵ গুণ)।</p>
  <div class="note amb">উপমা: পরমাণুকে একটি ফুটবল স্টেডিয়াম ধরলে নিউক্লিয়াস মাঝমাঠে রাখা একটি মার্বেলের মতো — অথচ স্টেডিয়ামের প্রায় সব ভর ওই মার্বেলেই!</div>
  <h4>স্বর্ণপাত কেন?</h4><ul><li>সোনা অত্যন্ত ঘাতসহ (malleable) — একে কয়েক শত পরমাণু পুরু পাতে পরিণত করা যায়, ফলে আলফা কণা একাধিকবার সংঘর্ষ ছাড়াই ভেদ করতে পারে।</li><li>সোনার পারমাণবিক সংখ্যা (৭৯) ও ভর বেশি — নিউক্লিয়াসের ধনাত্মক চার্জ বড় হওয়ায় বিচ্যুতি স্পষ্ট হয়।</li><li>সোনা নিষ্ক্রিয় ধাতু, বাতাসে অক্সাইডের আস্তরণ পড়ে না।</li></ul>`,
  sc: `<h4>বিচ্যুতির পেছনের বল: কুলম্বের সূত্র</h4><p>আলফা কণা (চার্জ +2e) ও স্বর্ণের নিউক্লিয়াসের (চার্জ +79e) মধ্যে বিকর্ষণ বল:</p><div class="eq">F = (1/4πε₀) × (2e)(Ze) / r²</div><p>দূরত্ব r যত কমে, বল তত দ্রুত (r²-এর ব্যস্তানুপাতে) বাড়ে। কণাটি নিউক্লিয়াসের যত কাছ দিয়ে যায় (সংঘর্ষ প্যারামিটার b যত ছোট), বিচ্যুতির কোণ θ তত বড়। মুখোমুখি (b ≈ 0) গেলে কণাটি থেমে উল্টো ফিরে আসে।</p>
  <h4>সর্বনিম্ন দূরত্ব (closest approach)</h4><p>মুখোমুখি সংঘর্ষে আলফা কণার সমস্ত গতিশক্তি বিভবশক্তিতে রূপান্তরিত হলে:</p><div class="eq">½mv² = (1/4πε₀) × 2Ze² / r<sub>min</sub>  ⟹  r<sub>min</sub> = 4Ze² / (4πε₀ · mv²)</div><p>এই r<sub>min</sub> থেকেই নিউক্লিয়াসের আকারের ঊর্ধ্বসীমা অনুমান করা হয় (প্রায় ১০⁻¹⁴ মিটার ক্রমের)।</p>
  <p><b>ব্যতিক্রম / সতর্কতা:</b> খুব পুরু পাত হলে বহুবার সংঘর্ষে ফল জটিল হতো; তাই অতি পাতলা পাত প্রয়োজন।</p>`,

  ap: ['নিউক্লিয়াসের আবিষ্কার পারমাণবিক শক্তি, তেজস্ক্রিয়তা ও নিউক্লীয় চিকিৎসার ভিত্তি।', 'রাদারফোর্ড ব্যাকস্ক্যাটারিং স্পেকট্রোমেট্রি (RBS) — আজও অর্ধপরিবাহী শিল্পে পাতলা স্তরের গঠন বিশ্লেষণে ব্যবহৃত হয়।'],
  cm: ['"অধিকাংশ কণা ফিরে আসে" লেখা — আসলে অধিকাংশই সোজা যায়।', 'নিউক্লিয়াসের আকার বোঝাতে "ফিরে আসা" পর্যবেক্ষণ বাদ দিয়ে শুধু "বেঁকে যাওয়া" দিয়ে ব্যাখ্যা করা।', 'আলফা কণাকে ঋণাত্মক ভাবা — এটি ধনাত্মক (He²⁺)।'],

  sn: ['পরীক্ষা: Po উৎস → সরু আলফা রশ্মি → স্বর্ণপাত → ZnS পর্দা।', 'সিদ্ধান্ত ১: পরমাণুর বেশিরভাগ ফাঁকা।', 'সিদ্ধান্ত ২: কেন্দ্রে ধনাত্মক নিউক্লিয়াস।', 'সিদ্ধান্ত ৩: নিউক্লিয়াস ক্ষুদ্র কিন্তু প্রায় সব ভর ধারণ করে।'],

{

  v: ['rfAtom'],
  ov: `<p>আলফা কণা পরীক্ষার ফল থেকে রাদারফোর্ড ১৯১১ সালে পরমাণুর একটি মডেল দেন, যা দেখতে সৌরজগতের মতো: মাঝখানে সূর্যের মতো ভারী ধনাত্মক <b>নিউক্লিয়াস</b>, আর গ্রহের মতো তার চারপাশে ঘুরছে <b>ইলেকট্রন</b>। তাই একে <b>সৌরজগৎ মডেল</b> বা <b>নিউক্লিয়াস মডেল</b> বলে।</p>`,
  dp: `<h4>রাদারফোর্ড মডেলের স্বীকার্য</h4><ol class="steps"><li>পরমাণু দুটি অংশে গঠিত — কেন্দ্রে নিউক্লিয়াস এবং নিউক্লিয়াসের বাইরে ইলেকট্রন বিশিষ্ট বহিঃকেন্দ্রিক অংশ।</li><li>পরমাণুর সমস্ত ধনাত্মক চার্জ ও প্রায় সমস্ত ভর নিউক্লিয়াসে কেন্দ্রীভূত।</li><li>পরমাণুর আয়তনের তুলনায় নিউক্লিয়াসের আয়তন অতি নগণ্য; পরমাণুর অধিকাংশ স্থান ফাঁকা।</li><li>পরমাণু তড়িৎ নিরপেক্ষ, তাই নিউক্লিয়াসের ধনাত্মক চার্জের সংখ্যা ও বাইরের ইলেকট্রনের সংখ্যা সমান।</li><li>সৌরজগতে গ্রহের মতো ইলেকট্রনগুলো নিউক্লিয়াসের চারদিকে বিভিন্ন কক্ষপথে অবিরত ঘুরছে। ঘূর্ণনের ফলে সৃষ্ট কেন্দ্রবিমুখী বল নিউক্লিয়াস ও ইলেকট্রনের মধ্যকার কেন্দ্রমুখী স্থির-বৈদ্যুতিক আকর্ষণ বলের সমান — তাই ইলেকট্রন নিউক্লিয়াসে পড়ে যায় না।</li></ol>

  <h4>রাদারফোর্ড মডেলের সীমাবদ্ধতা</h4><ol><li><b>স্থিতিশীলতা ব্যাখ্যা করতে পারে না:</b> ম্যাক্সওয়েলের তড়িৎচুম্বকীয় তত্ত্ব অনুসারে বৃত্তাকার পথে ঘূর্ণায়মান চার্জিত কণার ত্বরণ থাকে, তাই এটি অবিরত শক্তি বিকিরণ করবে। ফলে ইলেকট্রনের শক্তি কমতে থাকবে, কক্ষপথ ছোট হতে থাকবে এবং শেষে সর্পিল পথে নিউক্লিয়াসে পড়ে যাবে (হিসাবে প্রায় ১০⁻⁸ সেকেন্ডে)। কিন্তু বাস্তবে পরমাণু স্থিতিশীল।</li><li><b>রেখা বর্ণালি ব্যাখ্যা করতে পারে না:</b> ইলেকট্রন অবিরত শক্তি হারালে সব তরঙ্গদৈর্ঘ্যের আলো বের হতো, অর্থাৎ অবিচ্ছিন্ন (continuous) বর্ণালি পাওয়ার কথা। বাস্তবে পরমাণু নির্দিষ্ট তরঙ্গদৈর্ঘ্যের রেখা বর্ণালি দেয়।</li><li>কক্ষপথের আকার, আকৃতি, ব্যাসার্ধ বা শক্তি সম্পর্কে কোনো ধারণা দেয়নি।</li><li>একাধিক ইলেকট্রন পরমাণুতে ইলেকট্রনগুলো কীভাবে বিন্যস্ত থাকে, তা বলেনি।</li><li>সৌরজগতের সাথে তুলনা ত্রুটিপূর্ণ: গ্রহগুলো চার্জহীন এবং পরস্পরকে আকর্ষণ করে; কিন্তু ইলেকট্রনগুলো ঋণাত্মক চার্জযুক্ত বলে পরস্পরকে বিকর্ষণ করে।</li></ol>`,
  sc: `<p>কেন্দ্রমুখী ত্বরণ a = v²/r থাকায় চিরায়ত তড়িৎগতিবিদ্যা অনুযায়ী বিকিরণের ক্ষমতা P ∝ e²a² (লারমর সূত্র)। ফলে প্রতিটি আবর্তনে শক্তি হারিয়ে r কমে, ফলে a আরও বাড়ে, বিকিরণ আরও দ্রুত হয় — একটি ধ্বংসাত্মক চক্র। এই সমস্যার সমাধান চিরায়ত পদার্থবিদ্যা দিয়ে সম্ভব হয়নি; বোর কোয়ান্টাম ধারণা প্রয়োগ করে "স্থির কক্ষপথ" স্বীকার্য দেন।</p>`,

{
  id: 's1d', no: '২.১.৩', t: 'বোর পরমাণু মডেল',
  v: ['bohrSim'],
  ov: `<p>১৯১৩ সালে ড্যানিশ বিজ্ঞানী <b>নীলস বোর</b> প্ল্যাঙ্কের কোয়ান্টাম তত্ত্ব ব্যবহার করে রাদারফোর্ড মডেলকে উন্নত করেন। মূল ভাবনা: ইলেকট্রন যেকোনো দূরত্বে নয়, শুধু কিছু <b>নির্দিষ্ট শক্তির কক্ষপথে</b> ঘুরতে পারে — সিঁড়ির ধাপের মতো। ধাপে থাকলে শক্তি হারায় না; এক ধাপ থেকে অন্য ধাপে লাফ দিলে তবেই নির্দিষ্ট পরিমাণ শক্তি (ফোটন) শোষণ বা বিকিরণ করে।</p>`,
  dp: `<h4>বোর মডেলের স্বীকার্যসমূহ</h4><ol class="steps"><li><b>স্থির কক্ষপথ (Stationary orbit):</b> ইলেকট্রনগুলো নিউক্লিয়াসের চারদিকে কয়েকটি নির্দিষ্ট ব্যাসার্ধের বৃত্তাকার কক্ষপথে ঘোরে। প্রতিটি কক্ষপথের শক্তি নির্দিষ্ট, তাই এদের <b>শক্তিস্তর</b> বলে। কোনো স্থির কক্ষপথে থাকা অবস্থায় ইলেকট্রন শক্তি শোষণ বা বিকিরণ করে না। কক্ষপথগুলোকে n = ১, ২, ৩, ৪… বা K, L, M, N… দ্বারা প্রকাশ করা হয়।</li><li><b>কৌণিক ভরবেগের কোয়ান্টায়ন:</b> যেসব কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ (mvr) h/2π-এর পূর্ণসংখ্যার গুণিতক, কেবল সেসব কক্ষপথেই ইলেকট্রন ঘুরতে পারে: <span class="f">mvr = nh/2π</span>, যেখানে n = ১, ২, ৩…</li><li><b>শক্তি শোষণ ও বিকিরণ:</b> ইলেকট্রন যখন উচ্চ শক্তিস্তর (E₂) থেকে নিম্ন শক্তিস্তরে (E₁) নেমে আসে তখন ΔE = E₂ − E₁ শক্তি বিকিরণ করে; আর উপযুক্ত শক্তি শোষণ করে নিম্ন থেকে উচ্চ স্তরে যায়। বিকিরিত/শোষিত শক্তি একটি ফোটন হিসেবে: <span class="f">ΔE = E₂ − E₁ = hν</span>।</li></ol>
  <p>নিউক্লিয়াস থেকে দূরত্ব বাড়ার সাথে কক্ষপথের শক্তি বাড়ে (কম ঋণাত্মক হয়), কিন্তু পাশাপাশি দুটি স্তরের শক্তির পার্থক্য ক্রমশ কমে।</p>
  <h4>বোর মডেলের সাফল্য</h4><ul><li>পরমাণুর স্থিতিশীলতা ব্যাখ্যা করে (স্থির কক্ষপথে শক্তি বিকিরণ হয় না)।</li><li>হাইড্রোজেনের রেখা বর্ণালি নিখুঁতভাবে ব্যাখ্যা করে এবং রিডবার্গ ধ্রুবকের মান তাত্ত্বিকভাবে নির্ণয় করে।</li><li>কক্ষপথের ব্যাসার্ধ, ইলেকট্রনের বেগ ও শক্তি গণনা করা যায়।</li><li>শক্তিস্তর ধারণা থেকে প্রতিটি স্তরে সর্বোচ্চ 2n² ইলেকট্রনের ধারণা আসে।</li></ul>
  <h4>বোর মডেলের সীমাবদ্ধতা</h4><ol><li>শুধু এক-ইলেকট্রন বিশিষ্ট কণার (H, He⁺, Li²⁺, Be³⁺) বর্ণালি ব্যাখ্যা করতে পারে; বহু-ইলেকট্রন পরমাণুর বর্ণালি নয়।</li><li>উচ্চ বিশ্লেষণ ক্ষমতার বর্ণালিবীক্ষণ যন্ত্রে H-এর একটি রেখা কয়েকটি সূক্ষ্ম রেখায় বিভক্ত দেখা যায় (<b>সূক্ষ্ম গঠন</b>) — বোর মডেল তা ব্যাখ্যা করতে পারে না।</li><li>চৌম্বকক্ষেত্রে বর্ণালি রেখার বিভাজন (<b>জিম্যান প্রভাব</b>) ও তড়িৎক্ষেত্রে বিভাজন (<b>স্টার্ক প্রভাব</b>) ব্যাখ্যা করতে পারে না।</li><li>ইলেকট্রনকে নির্দিষ্ট বৃত্তাকার পথে নির্দিষ্ট বেগে চলমান ধরা হয়েছে, অর্থাৎ অবস্থান ও ভরবেগ একসাথে নির্দিষ্ট — যা <b>হাইজেনবার্গের অনিশ্চয়তা নীতির</b> পরিপন্থী।</li><li>ইলেকট্রনের তরঙ্গ ধর্ম (দ্য ব্রগলি) বিবেচনা করেনি।</li><li>শুধু বৃত্তাকার কক্ষপথ ধরেছে (পরে সমারফিল্ড উপবৃত্তাকার কক্ষপথ প্রস্তাব করেন)।</li><li>রাসায়নিক বন্ধন গঠন ও অণুর ত্রিমাত্রিক আকৃতি ব্যাখ্যা করতে পারে না; বর্ণালি রেখার তীব্রতার পার্থক্যও ব্যাখ্যা করে না।</li></ol>`,
  sc: `<h4>১. কক্ষপথের ব্যাসার্ধ (উৎপত্তি)</h4><p>Z চার্জের নিউক্লিয়াসের চারদিকে m ভরের ইলেকট্রন r ব্যাসার্ধে v বেগে ঘুরলে, বলের সাম্য:</p><div class="eq">mv²/r = Ze²/(4πε₀r²)  ⟹  mv² = Ze²/(4πε₀r)   …(i)</div><p>বোরের শর্ত: mvr = nh/2π ⟹ v = nh/(2πmr)   …(ii)</p><p>(ii) কে (i)-এ বসিয়ে: m·n²h²/(4π²m²r²) = Ze²/(4πε₀r)</p><div class="eq">r<sub>n</sub> = ε₀n²h² / (πmZe²) = 0.529 × n²/Z  Å</div><p>(CGS এককে লেখা হয় r = n²h²/4π²mZe²।) হাইড্রোজেনের প্রথম কক্ষপথের ব্যাসার্ধ a₀ = 0.529 Å = 52.9 pm — একে <b>বোর ব্যাসার্ধ</b> বলে। r ∝ n² ⟹ r₁ : r₂ : r₃ = ১ : ৪ : ৯।</p>
  <h4>২. ইলেকট্রনের বেগ</h4><div class="eq">v<sub>n</sub> = Ze²/(2ε₀nh) = 2.18 × 10⁶ × Z/n  m s⁻¹</div><p>v ∝ 1/n: বাইরের কক্ষপথে ইলেকট্রন ধীরে চলে। H-এর প্রথম কক্ষপথে বেগ আলোর বেগের প্রায় ১/১৩৭ ভাগ।</p>

  <h4>৪. নির্গত বিকিরণের তরঙ্গসংখ্যা</h4><div class="eq">ΔE = hν = hc/λ  ⟹  1/λ = R<sub>H</sub> Z² (1/n₁² − 1/n₂²)</div><p>এখানে R<sub>H</sub> = me⁴/(8ε₀²h³c) = 1.097 × 10⁷ m⁻¹ = 109678 cm⁻¹ (রিডবার্গ ধ্রুবক)।</p>`,

  dp: `<h4>প্রয়োগের ক্ষেত্রসমূহ</h4><ol><li><b>H পরমাণুর রেখা বর্ণালি ব্যাখ্যা:</b> উত্তেজিত ইলেকট্রন বিভিন্ন উচ্চস্তর থেকে নির্দিষ্ট নিম্নস্তরে নামলে লাইম্যান, বামার, পাশেন, ব্র্যাকেট, ফুন্ড ধারা তৈরি হয় (বিস্তারিত ২.৭)।</li><li><b>কক্ষপথের ব্যাসার্ধ নির্ণয়:</b> r = 0.529 n²/Z Å।</li><li><b>ইলেকট্রনের বেগ নির্ণয়:</b> v = 2.18×10⁶ Z/n m s⁻¹।</li><li><b>কক্ষপথের শক্তি ও আয়নীকরণ শক্তি নির্ণয়:</b> IE = E<sub>∞</sub> − E₁ = +13.6 Z² eV (ভূমি অবস্থা থেকে)।</li><li><b>রিডবার্গ ধ্রুবকের তাত্ত্বিক মান নির্ণয়</b> — পরীক্ষালব্ধ মানের সাথে প্রায় হুবহু মিলে যায়।</li><li><b>এক-ইলেকট্রন আয়নের বর্ণালি:</b> He⁺, Li²⁺ ইত্যাদি।</li><li><b>শক্তিস্তরে ইলেকট্রনের সংখ্যা:</b> শক্তিস্তর ধারণা থেকে 2n² নিয়মের সূচনা।</li></ol>
  <h4>সমাধানকৃত উদাহরণ</h4>
  <p><b>উদাহরণ ১:</b> H পরমাণুর তৃতীয় কক্ষপথের ব্যাসার্ধ নির্ণয় করো।<br>সমাধান: r₃ = 0.529 × 3²/1 = 0.529 × 9 = <b>4.761 Å</b>।</p>
  <p><b>উদাহরণ ২:</b> He⁺ আয়নের দ্বিতীয় কক্ষপথের শক্তি কত?<br>সমাধান: E = −13.6 × Z²/n² = −13.6 × 4/4 = <b>−13.6 eV</b> (= −2.18×10⁻¹⁸ J)। মজার ব্যাপার: এটি H-এর ভূমি অবস্থার শক্তির সমান।</p>
  <p><b>উদাহরণ ৩:</b> H পরমাণুতে ইলেকট্রন n = ৩ থেকে n = ২ স্তরে নামলে নির্গত আলোর তরঙ্গদৈর্ঘ্য কত?<br>সমাধান: 1/λ = R<sub>H</sub>(1/2² − 1/3²) = 109678 × (1/4 − 1/9) = 109678 × 5/36 = 15233 cm⁻¹<br>λ = 1/15233 cm = 6.565×10⁻⁵ cm = <b>656.5 nm</b> (লাল আলো, বামার ধারার Hα রেখা)।</p>
  <p><b>উদাহরণ ৪:</b> হাইড্রোজেনের আয়নীকরণ শক্তি kJ mol⁻¹ এককে নির্ণয় করো।<br>সমাধান: প্রতি পরমাণুতে 2.18×10⁻¹⁸ J; প্রতি মোলে = 2.18×10⁻¹⁸ × 6.022×10²³ = 1.313×10⁶ J = <b>1313 kJ mol⁻¹</b> (প্রচলিত মান ১৩১২)।</p>
  <p><b>উদাহরণ ৫:</b> কোনো এক-ইলেকট্রন আয়নের দ্বিতীয় কক্ষপথের ব্যাসার্ধ 0.705 Å হলে আয়নটি শনাক্ত করো।<br>সমাধান: 0.705 = 0.529 × 4/Z ⟹ Z = 2.116/0.705 = 3.0 ⟹ আয়নটি <b>Li²⁺</b>।</p>
  <p><b>উদাহরণ ৬:</b> H পরমাণুর প্রথম কক্ষপথে ইলেকট্রনের গতিশক্তি ও বিভবশক্তি নির্ণয় করো।<br>সমাধান: E₁ = −13.6 eV; KE = −E = <b>+13.6 eV</b>; PE = 2E = <b>−27.2 eV</b>।</p>`,

  ['বোর মডেল অনুযায়ী ইলেকট্রনের বিভবশক্তি (PE) ও গতিশক্তির (KE) সম্পর্ক —', ['PE = KE', 'PE = −KE', 'PE = −2KE', 'PE = 2KE'], 2, 'h', 'KE = Ze²/8πε₀r, PE = −Ze²/4πε₀r ⟹ PE = −2KE; মোট শক্তি E = −KE।', 's1d'],
  ['H পরমাণুতে ইলেকট্রন n = ২ থেকে n = ১ এ নামলে কত শক্তি নির্গত হয়?', ['3.4 eV', '10.2 eV', '12.1 eV', '13.6 eV'], 1, 'm', 'ΔE = 13.6(1 − 1/4) = 13.6 × 3/4 = 10.2 eV।', 's1f'],
  ['বোর তত্ত্ব ব্যাখ্যা করতে পারে না —<br>i. জিম্যান প্রভাব<br>ii. H পরমাণুর রেখা বর্ণালি<br>iii. বর্ণালির সূক্ষ্ম রেখা<br>নিচের কোনটি সঠিক?', ['i ও ii', 'i ও iii', 'ii ও iii', 'i, ii ও iii'], 1, 'm', 'H-এর রেখা বর্ণালি বোর মডেলের সাফল্য; জিম্যান প্রভাব ও সূক্ষ্ম রেখা ব্যর্থতা।', 's1d'],
  ['বোর মডেলে n-এর মান বাড়লে —<br>i. কক্ষপথের ব্যাসার্ধ বাড়ে<br>ii. কক্ষপথের শক্তি বাড়ে<br>iii. ইলেকট্রনের বেগ বাড়ে<br>নিচের কোনটি সঠিক?', ['i ও ii', 'i ও iii', 'ii ও iii', 'i, ii ও iii'], 0, 'h', 'r ∝ n² (বাড়ে), E = −13.6/n² (কম ঋণাত্মক, অর্থাৎ বাড়ে), v ∝ 1/n (কমে)।', 's1f'],
  ['থমসনের পরমাণু মডেলকে বলা হয় —', ['সৌরজগৎ মডেল', 'কিশমিশ-পুডিং মডেল', 'নিউক্লিয়াস মডেল', 'স্থির কক্ষপথ মডেল'], 1, 'e', 'ধনাত্মক গোলকে ইলেকট্রন কিশমিশের মতো গাঁথা — তাই plum pudding মডেল।', 's1a'],
  ['বোর মডেলের মূল ভিত্তি কোনটি?', ['ম্যাক্সওয়েলের তড়িৎচুম্বকীয় তত্ত্ব', 'প্ল্যাঙ্কের কোয়ান্টাম তত্ত্ব', 'নিউটনের গতিসূত্র', 'ডাল্টনের পরমাণুবাদ'], 1, 'e', 'বোর প্ল্যাঙ্কের E = hν ধারণা প্রয়োগ করে শক্তিস্তরের কোয়ান্টায়ন প্রস্তাব করেন।', 's1d'],
  ['কোনো এক-ইলেকট্রন আয়নের দ্বিতীয় কক্ষপথের ব্যাসার্ধ 0.705 Å। আয়নটি কোনটি?', ['H', 'He⁺', 'Li²⁺', 'Be³⁺'], 2, 'h', 'r = 0.529 × 4/Z = 0.705 ⟹ Z = 3 ⟹ Li²⁺।', 's1f'],
  ['H পরমাণুর প্রথম কক্ষপথে ইলেকট্রনের বেগ প্রায় —', ['3×10⁸ m s⁻¹', '2.18×10⁶ m s⁻¹', '2.18×10⁻¹⁸ m s⁻¹', '1.6×10⁻¹⁹ m s⁻¹'], 1, 'm', 'v₁ = 2.18×10⁶ m s⁻¹, যা আলোর বেগের প্রায় ১/১৩৭ ভাগ।', 's1d']
],
sq: [
  ['পরমাণু মডেল কাকে বলে?', 'পরীক্ষালব্ধ তথ্যের ভিত্তিতে পরমাণুর অভ্যন্তরীণ গঠন — মৌলিক কণার অবস্থান, বিন্যাস ও আচরণ — সম্পর্কে প্রস্তাবিত চিত্র বা তত্ত্বকে পরমাণু মডেল বলে।'],
  ['আলফা কণা কী? এর চার্জ ও ভর কত?', 'আলফা কণা হলো হিলিয়াম নিউক্লিয়াস (⁴₂He²⁺), যাতে ২টি প্রোটন ও ২টি নিউট্রন থাকে। চার্জ +২ একক (+3.2×10⁻¹⁹ C), ভর ৪ amu (প্রায় 6.64×10⁻²⁷ kg)।'],
  ['রাদারফোর্ডের পরীক্ষায় স্বর্ণপাত ব্যবহারের কারণ কী?', 'সোনা অত্যন্ত ঘাতসহ, তাই কয়েক শত পরমাণু পুরু অতি পাতলা পাত তৈরি করা যায়; এর পারমাণবিক সংখ্যা বেশি (৭৯) বলে বিচ্যুতি স্পষ্ট হয়; এবং এটি নিষ্ক্রিয় বলে বাতাসে ক্ষয় হয় না।'],
  ['নিউক্লিয়াস কাকে বলে?', 'পরমাণুর কেন্দ্রে অবস্থিত অতি ক্ষুদ্র, ঘন, ধনাত্মক চার্জযুক্ত অংশ, যেখানে প্রোটন ও নিউট্রন থাকে এবং পরমাণুর প্রায় সমস্ত ভর কেন্দ্রীভূত — তাকে নিউক্লিয়াস বলে।'],
  ['রাদারফোর্ড মডেলকে সৌরজগৎ মডেল বলা হয় কেন?', 'সূর্যের চারদিকে গ্রহগুলো যেভাবে নির্দিষ্ট পথে ঘোরে, রাদারফোর্ড মডেলে তেমনি নিউক্লিয়াসের চারদিকে ইলেকট্রনগুলো ঘোরে এবং আকর্ষণ বল ও কেন্দ্রবিমুখী বল সাম্যে থাকে — এই মিলের জন্য।'],
  ['স্থির কক্ষপথ কী?', 'বোর মডেল অনুযায়ী নিউক্লিয়াসের চারদিকে যে সকল নির্দিষ্ট ব্যাসার্ধ ও শক্তির বৃত্তাকার পথে ঘোরার সময় ইলেকট্রন কোনো শক্তি শোষণ বা বিকিরণ করে না, সেগুলোকে স্থির কক্ষপথ বা শক্তিস্তর বলে।'],
  ['কোয়ান্টায়িত কৌণিক ভরবেগ বলতে কী বোঝায়?', 'ইলেকট্রনের কৌণিক ভরবেগ যেকোনো মান নিতে পারে না, কেবল h/2π-এর পূর্ণসংখ্যা গুণিতক (mvr = nh/2π) হতে পারে — একে কৌণিক ভরবেগের কোয়ান্টায়ন বলে।'],
  ['বোর মডেল বহু-ইলেকট্রন পরমাণুর ক্ষেত্রে ব্যর্থ কেন?', 'বোর মডেলে কেবল নিউক্লিয়াস ও একটি ইলেকট্রনের আকর্ষণ বিবেচনা করা হয়েছে। বহু-ইলেকট্রন পরমাণুতে ইলেকট্রন-ইলেকট্রন বিকর্ষণ ও আবরণী প্রভাব থাকে, যা এই মডেলে নেই; তাই তাদের বর্ণালি ব্যাখ্যা করা যায় না।'],
  ['H পরমাণুর দ্বিতীয় কক্ষপথের শক্তি কত?', 'E₂ = −13.6/2² = −3.4 eV = −5.45×10⁻¹⁹ J।'],
  ['জিম্যান প্রভাব কী?', 'শক্তিশালী চৌম্বকক্ষেত্রে রাখলে পরমাণুর বর্ণালির একটি রেখা কয়েকটি সূক্ষ্ম রেখায় বিভক্ত হয় — একে জিম্যান প্রভাব বলে। বোর মডেল এটি ব্যাখ্যা করতে পারে না।'],
  ['আয়নীকরণ শক্তি কাকে বলে? H-এর আয়নীকরণ শক্তি কত?', 'গ্যাসীয় অবস্থায় একটি বিচ্ছিন্ন পরমাণুর ভূমি অবস্থা থেকে একটি ইলেকট্রনকে অসীম দূরত্বে সরাতে যে ন্যূনতম শক্তি লাগে। H-এর জন্য 13.6 eV বা 1312 kJ mol⁻¹।']
],
cq: [
  { s: 'একজন বিজ্ঞানী একটি তেজস্ক্রিয় উৎস থেকে নির্গত ধনাত্মক কণার সরু রশ্মি অতি পাতলা একটি ধাতব পাতে আঘাত করান। দেখা গেল অধিকাংশ কণা সোজা চলে যায়, কিছু কণা বিভিন্ন কোণে বেঁকে যায় এবং প্রায় ২০,০০০ কণার মধ্যে একটি ফিরে আসে।', p: [
    ['ধনাত্মক কণাটির নাম ও প্রতীক লেখো।', 'কণাটি আলফা কণা, প্রতীক ⁴₂He²⁺।'],
    ['উদ্দীপকের পর্যবেক্ষণ থেকে "পরমাণুর অধিকাংশ স্থান ফাঁকা" — ব্যাখ্যা করো।', 'অধিকাংশ আলফা কণা কোনো বিচ্যুতি ছাড়াই ধাতব পাত ভেদ করে সোজা চলে গেছে। কণাগুলো যদি পথে কোনো ভারী বা চার্জিত বস্তুর সংস্পর্শে আসত, তবে বেঁকে যেত বা বাধা পেত। বাধা না পাওয়ায় বোঝা যায় পরমাণুর অভ্যন্তরের বেশিরভাগ অংশে কিছু নেই, অর্থাৎ ফাঁকা।'],
    ['উদ্দীপকের পরীক্ষার ভিত্তিতে প্রস্তাবিত পরমাণু মডেলের স্বীকার্যগুলো লেখো।', 'পরীক্ষাটি রাদারফোর্ডের আলফা কণা বিচ্ছুরণ পরীক্ষা। এর ভিত্তিতে প্রস্তাবিত রাদারফোর্ড মডেলের স্বীকার্য:<br>১. পরমাণুর কেন্দ্রে ধনাত্মক চার্জযুক্ত অতি ক্ষুদ্র নিউক্লিয়াস আছে, যেখানে প্রায় সমস্ত ভর কেন্দ্রীভূত।<br>২. পরমাণুর আয়তনের তুলনায় নিউক্লিয়াসের আয়তন নগণ্য; অধিকাংশ স্থান ফাঁকা।<br>৩. নিউক্লিয়াসের ধনাত্মক চার্জ সংখ্যা ও বাইরের ইলেকট্রন সংখ্যা সমান, তাই পরমাণু নিস্তড়িৎ।<br>৪. সৌরজগতে গ্রহের মতো ইলেকট্রনগুলো নিউক্লিয়াসের চারদিকে ঘোরে; ঘূর্ণনজনিত কেন্দ্রবিমুখী বল নিউক্লিয়াসের কেন্দ্রমুখী আকর্ষণ বলের সমান।'],
    ['উক্ত মডেলটি পরমাণুর স্থিতিশীলতা ব্যাখ্যায় ব্যর্থ — বিশ্লেষণ করো।', 'রাদারফোর্ড মডেলে ইলেকট্রন নিউক্লিয়াসের চারদিকে বৃত্তাকার পথে ঘোরে। বৃত্তাকার গতিতে বেগের দিক প্রতিনিয়ত বদলায়, তাই ইলেকট্রনের কেন্দ্রমুখী ত্বরণ থাকে। ম্যাক্সওয়েলের তড়িৎচুম্বকীয় তত্ত্ব অনুযায়ী ত্বরিত চার্জিত কণা অবিরত তড়িৎচুম্বকীয় শক্তি বিকিরণ করে।<br>ফলে ইলেকট্রনের শক্তি ক্রমাগত কমবে, কক্ষপথের ব্যাসার্ধ ছোট হতে থাকবে এবং সর্পিল পথে ঘুরে অল্প সময়ের (≈১০⁻⁸ সে.) মধ্যে নিউক্লিয়াসে পড়ে যাবে — পরমাণু ধ্বংস হবে।<br>কিন্তু বাস্তবে পরমাণু স্থিতিশীল এবং বর্ণালিতে অবিচ্ছিন্ন নয়, রেখা বর্ণালি পাওয়া যায়। অর্থাৎ মডেলের ভবিষ্যদ্বাণী পর্যবেক্ষণের সাথে সাংঘর্ষিক। তাই রাদারফোর্ড মডেল পরমাণুর স্থিতিশীলতা ব্যাখ্যায় ব্যর্থ; পরে বোর "স্থির কক্ষপথে শক্তি বিকিরণ হয় না" — এই কোয়ান্টাম স্বীকার্য দিয়ে সমস্যাটি সমাধান করেন।']
  ] },
  { s: 'হাইড্রোজেন পরমাণুর একটি ইলেকট্রন n = ৩ শক্তিস্তরে উত্তেজিত অবস্থায় আছে। এটি দুইভাবে ভূমি অবস্থায় ফিরতে পারে: পথ-১: ৩ → ১; পথ-২: ৩ → ২ → ১। [R<sub>H</sub> = 109678 cm⁻¹, h = 6.626×10⁻³⁴ J s]', p: [
    ['বোরের দ্বিতীয় স্বীকার্যটি লেখো।', 'যেসব কক্ষপথে ইলেকট্রনের কৌণিক ভরবেগ h/2π-এর পূর্ণসংখ্যা গুণিতক, অর্থাৎ mvr = nh/2π, কেবল সেসব কক্ষপথেই ইলেকট্রন ঘুরতে পারে।'],
    ['স্থির কক্ষপথে ইলেকট্রন শক্তি বিকিরণ করে না কেন?', 'বোরের প্রথম স্বীকার্য অনুযায়ী প্রতিটি স্থির কক্ষপথের শক্তি নির্দিষ্ট। ইলেকট্রন সেখানে থাকলে শক্তির কোনো পরিবর্তন হয় না, তাই বিকিরণও হয় না। শক্তির পরিবর্তন (ফোটন নির্গমন বা শোষণ) কেবল এক কক্ষপথ থেকে অন্য কক্ষপথে স্থানান্তরের সময় ঘটে।'],
    ['পথ-২ এর ৩ → ২ ধাপে নির্গত বিকিরণের তরঙ্গদৈর্ঘ্য নির্ণয় করো।', '1/λ = R<sub>H</sub>(1/n₁² − 1/n₂²) = 109678 × (1/4 − 1/9) = 109678 × 5/36 = 15233 cm⁻¹<br>λ = 1/15233 = 6.565×10⁻⁵ cm = 656.5 nm।<br>এটি দৃশ্যমান লাল আলো (বামার ধারার Hα রেখা)।'],
    ['দুই পথে নির্গত মোট শক্তি সমান — গাণিতিকভাবে যাচাই করো।', 'E<sub>n</sub> = −13.6/n² eV: E₁ = −13.6, E₂ = −3.4, E₃ = −1.511 eV।<br>পথ-১ (৩→১): ΔE = −1.511 − (−13.6) = 12.089 eV।<br>পথ-২: ৩→২: −1.511 − (−3.4) = 1.889 eV; ২→১: −3.4 − (−13.6) = 10.2 eV; মোট = 1.889 + 10.2 = 12.089 eV।<br>দুই পথেই মোট নির্গত শক্তি 12.089 eV — সমান। কারণ শক্তিস্তরগুলোর শক্তি নির্দিষ্ট (অবস্থা অপেক্ষক); প্রাথমিক ও চূড়ান্ত অবস্থা একই হলে মধ্যবর্তী পথ যাই হোক মোট শক্তি পরিবর্তন একই। তবে পথ-১-এ একটি অতিবেগুনি ফোটন (লাইম্যান), আর পথ-২-এ একটি লাল ও একটি অতিবেগুনি ফোটন নির্গত হয় — অর্থাৎ বর্ণালি রেখা ভিন্ন হলেও মোট শক্তি সমান।']
  ] },
  { s: 'X ও Y দুটি এক-ইলেকট্রন বিশিষ্ট কণা। X = হাইড্রোজেন পরমাণু; Y-এর নিউক্লিয়াসে ২টি প্রোটন আছে।', p: [
    ['বোর ব্যাসার্ধ কী?', 'হাইড্রোজেন পরমাণুর প্রথম বোর কক্ষপথের ব্যাসার্ধ, a₀ = 0.529 Å।'],
    ['Y কণাটির ক্ষেত্রে বোর মডেল প্রযোজ্য কেন?', 'Y-এর নিউক্লিয়াসে ২টি প্রোটন, অর্থাৎ এটি হিলিয়াম; একটি মাত্র ইলেকট্রন থাকায় এটি He⁺। বোর মডেল এক-ইলেকট্রন বিশিষ্ট কণার জন্য প্রযোজ্য, কারণ এখানে ইলেকট্রন-ইলেকট্রন বিকর্ষণ নেই — তাই He⁺ বোর মডেল মেনে চলে।'],
    ['Y-এর দ্বিতীয় কক্ষপথের ব্যাসার্ধ নির্ণয় করো।', 'r<sub>n</sub> = 0.529 n²/Z Å; Y = He⁺, Z = ২, n = ২<br>r₂ = 0.529 × 4/2 = 1.058 Å।'],
    ['X ও Y-এর প্রথম কক্ষপথের শক্তির তুলনা করো এবং কোনটিকে আয়নিত করা কঠিন — বিশ্লেষণ করো।', 'E₁ = −13.6Z²/n²<br>X (H, Z = ১): E₁ = −13.6 eV; আয়নীকরণ শক্তি 13.6 eV।<br>Y (He⁺, Z = ২): E₁ = −13.6 × 4 = −54.4 eV; আয়নীকরণ শক্তি 54.4 eV।<br>Y-এর শক্তি X-এর চার গুণ বেশি ঋণাত্মক — অর্থাৎ ইলেকট্রন নিউক্লিয়াসের সাথে অনেক দৃঢ়ভাবে আবদ্ধ। কারণ: Y-এর নিউক্লীয় চার্জ দ্বিগুণ, এবং কক্ষপথের ব্যাসার্ধ অর্ধেক (0.2645 Å); ফলে আকর্ষণ বল ∝ Z/r² অনেক বেশি। তাই Y (He⁺) কে আয়নিত করতে X-এর চার গুণ শক্তি লাগে — Y কে আয়নিত করা কঠিন।']
  ] },
  { s: 'দুটি পরমাণু মডেলের বৈশিষ্ট্য — মডেল A: ইলেকট্রন নিউক্লিয়াসের চারদিকে যেকোনো দূরত্বে ঘুরতে পারে। মডেল B: ইলেকট্রন কেবল নির্দিষ্ট শক্তির কক্ষপথে ঘোরে এবং এক কক্ষপথ থেকে অন্য কক্ষপথে গেলে ΔE = hν শক্তি শোষণ বা বিকিরণ করে।', p: [
    ['প্ল্যাঙ্ক ধ্রুবকের মান লেখো।', 'h = 6.626×10⁻³⁴ J s।'],
    ['মডেল A তে পরমাণুর রেখা বর্ণালি ব্যাখ্যা করা যায় না কেন?', 'মডেল A (রাদারফোর্ড) অনুযায়ী ইলেকট্রন অবিরত ঘোরার সময় ক্রমাগত শক্তি বিকিরণ করবে এবং যেকোনো দূরত্বে থাকতে পারে, ফলে সব রকম তরঙ্গদৈর্ঘ্যের বিকিরণ বের হবে — অর্থাৎ অবিচ্ছিন্ন বর্ণালি পাওয়ার কথা। কিন্তু বাস্তবে নির্দিষ্ট তরঙ্গদৈর্ঘ্যের রেখা বর্ণালি পাওয়া যায়।'],
    ['মডেল B এর আলোকে হাইড্রোজেন পরমাণুর রেখা বর্ণালি সৃষ্টির কারণ ব্যাখ্যা করো।', 'মডেল B বোর মডেল। হাইড্রোজেন গ্যাসে তড়িৎ মোক্ষণ করলে পরমাণুগুলো শক্তি শোষণ করে উচ্চ শক্তিস্তরে (n₂) যায়। উত্তেজিত অবস্থা অস্থায়ী, তাই ইলেকট্রন নিম্ন শক্তিস্তরে (n₁) ফিরে আসে এবং ΔE = E<sub>n₂</sub> − E<sub>n₁</sub> = hν শক্তির ফোটন নির্গত করে। শক্তিস্তরগুলোর শক্তি নির্দিষ্ট বলে ΔE-এর মানও নির্দিষ্ট, ফলে কেবল নির্দিষ্ট কম্পাঙ্কের আলো বের হয় এবং বর্ণালিতে আলাদা আলাদা রেখা দেখা যায়। n₁ = ১, ২, ৩… অনুযায়ী যথাক্রমে লাইম্যান, বামার, পাশেন… ধারা সৃষ্টি হয়: 1/λ = R<sub>H</sub>(1/n₁² − 1/n₂²)।'],
    ['মডেল A ও মডেল B এর মধ্যে কোনটি অধিক গ্রহণযোগ্য? যুক্তিসহ মতামত দাও।', 'মডেল B (বোর) অধিক গ্রহণযোগ্য। যুক্তি:<br>১. মডেল A পরমাণুর স্থিতিশীলতা ব্যাখ্যা করতে পারে না; B স্থির কক্ষপথে বিকিরণ নেই বলে স্থিতিশীলতা ব্যাখ্যা করে।<br>২. A রেখা বর্ণালি ব্যাখ্যা করতে পারে না; B হাইড্রোজেনের রেখা বর্ণালি নিখুঁতভাবে ব্যাখ্যা করে এবং রিডবার্গ ধ্রুবক তাত্ত্বিকভাবে নির্ণয় করে।<br>৩. A তে কক্ষপথের ব্যাসার্ধ বা শক্তি নির্ণয় করা যায় না; B তে r, v, E গণনা করা যায়।<br>৪. B শক্তিস্তরের ধারণা দেয়, যা ইলেকট্রন বিন্যাসের ভিত্তি।<br>তবে B ও সম্পূর্ণ নয় — বহু-ইলেকট্রন পরমাণু, জিম্যান প্রভাব ও অনিশ্চয়তা নীতির ক্ষেত্রে এটি ব্যর্থ। তবু তুলনামূলক বিচারে B বেশি সফল, তাই অধিক গ্রহণযোগ্য।']
  ] },
  { s: 'হাইড্রোজেন পরমাণুর প্রথম কক্ষপথে একটি ইলেকট্রন ঘুরছে। [বোর ব্যাসার্ধ = 0.529 Å, প্রথম কক্ষপথে বেগ = 2.18×10⁶ m s⁻¹, ইলেকট্রনের ভর = 9.109×10⁻³¹ kg]', p: [
    ['শক্তিস্তর কাকে বলে?', 'পরমাণুতে নিউক্লিয়াসের চারদিকে যে নির্দিষ্ট শক্তিবিশিষ্ট কক্ষপথে ইলেকট্রন ঘোরে, তাকে শক্তিস্তর বলে।'],
    ['বোর মডেলে ইলেকট্রনের শক্তি ঋণাত্মক হয় কেন?', 'নিউক্লিয়াস থেকে অসীম দূরত্বে মুক্ত ইলেকট্রনের শক্তি শূন্য ধরা হয়। নিউক্লিয়াসের আকর্ষণে আবদ্ধ হলে ইলেকট্রন শক্তি হারায় (স্থিতিশীল হয়), তাই এর শক্তি শূন্যের চেয়ে কম অর্থাৎ ঋণাত্মক। ঋণাত্মক মান যত বেশি, ইলেকট্রন তত দৃঢ়ভাবে আবদ্ধ।'],
    ['উদ্দীপকের তথ্য ব্যবহার করে ইলেকট্রনের কৌণিক ভরবেগ নির্ণয় করো এবং দেখাও যে তা h/2π এর সমান।', 'mvr = 9.109×10⁻³¹ × 2.18×10⁶ × 0.529×10⁻¹⁰ = 1.0505×10⁻³⁴ kg m² s⁻¹।<br>h/2π = 6.626×10⁻³⁴ / 6.2832 = 1.0546×10⁻³⁴ J s।<br>মান দুটি প্রায় সমান (সামান্য পার্থক্য দশমিক আসন্নীকরণের জন্য), অর্থাৎ n = ১ এর জন্য mvr = h/2π — বোরের দ্বিতীয় স্বীকার্য সিদ্ধ হলো।'],
    ['উদ্দীপকের ইলেকট্রনের গতিশক্তি ও বিভবশক্তি নির্ণয় করে এদের সম্পর্ক বিশ্লেষণ করো।', 'KE = ½mv² = ½ × 9.109×10⁻³¹ × (2.18×10⁶)² = 2.164×10⁻¹⁸ J ≈ 13.5 eV।<br>মোট শক্তি E₁ = −2.18×10⁻¹⁸ J (−13.6 eV), এবং বোর তত্ত্বে E = −KE — হিসাবের মানের সাথে মিলে যায়।<br>PE = E − KE ≈ −2.18×10⁻¹⁸ − 2.16×10⁻¹⁸ = −4.34×10⁻¹⁸ J (≈ −27.1 eV), যা প্রায় −2 × KE।<br>সুতরাং PE = −2KE। কারণ: বলের সাম্য mv²/r = Ze²/4πε₀r² থেকে KE = Ze²/8πε₀r এবং PE = −Ze²/4πε₀r, যা KE-এর ঠিক দ্বিগুণ ও ঋণাত্মক। এই সম্পর্ক ভিরিয়াল উপপাদ্যের একটি রূপ — আকর্ষণে আবদ্ধ যেকোনো ব্যবস্থায় এটি প্রযোজ্য।']
  ] }
],
bq: [
  ['থমসন মডেলের মূল কথা কী?', 'পরমাণু একটি ধনাত্মক চার্জযুক্ত সুষম গোলক, যার মধ্যে ইলেকট্রনগুলো কিশমিশের মতো গাঁথা থাকে।'],
  ['আলফা কণা পরীক্ষায় বায়ুশূন্য প্রকোষ্ঠ ব্যবহার করা হয় কেন?', 'বাতাসের অণুর সাথে সংঘর্ষে আলফা কণা শক্তি হারায় ও বিচ্যুত হয়, যা স্বর্ণপাতের প্রভাবের সাথে মিশে ভুল ফল দিত। তাই বায়ুশূন্য রাখা হয়।'],
  ['বোরের তৃতীয় স্বীকার্যটি লেখো।', 'ইলেকট্রন উচ্চ শক্তিস্তর E₂ থেকে নিম্ন শক্তিস্তর E₁-এ নামলে ΔE = E₂ − E₁ = hν শক্তি বিকিরণ করে এবং ঐ পরিমাণ শক্তি শোষণ করলে নিম্ন থেকে উচ্চ স্তরে যায়।'],
  ['ইলেকট্রন নিউক্লিয়াসে পড়ে যায় না কেন — বোর মডেলের আলোকে ব্যাখ্যা করো।', 'বোরের মতে ইলেকট্রন স্থির কক্ষপথে ঘোরার সময় শক্তি বিকিরণ করে না, তাই এর শক্তি কমে না এবং কক্ষপথও ছোট হয় না। সর্বনিম্ন শক্তিস্তর n = ১ এর নিচে কোনো অনুমোদিত কক্ষপথ নেই, তাই ইলেকট্রন নিউক্লিয়াসে পড়ে না।'],
  ['n = ∞ এ ইলেকট্রনের শক্তি শূন্য কেন?', 'E = −13.6/n²; n → ∞ হলে E → 0। এ অবস্থায় ইলেকট্রন নিউক্লিয়াসের আকর্ষণমুক্ত — মুক্ত ইলেকট্রনের শক্তিকেই শূন্য ধরে অন্যান্য স্তরের শক্তি মাপা হয়।']
],
aq: [
  ['Li²⁺ আয়নের তৃতীয় কক্ষপথের শক্তি ও ব্যাসার্ধ নির্ণয় করো।', 'Z = ৩, n = ৩: E = −13.6 × 9/9 = −13.6 eV; r = 0.529 × 9/3 = 1.587 Å।'],
  ['H পরমাণুর n = ৪ থেকে n = ২ স্থানান্তরে নির্গত ফোটনের শক্তি (J) ও তরঙ্গদৈর্ঘ্য নির্ণয় করো।', 'ΔE = 13.6(1/4 − 1/16) = 13.6 × 3/16 = 2.55 eV = 4.085×10⁻¹⁹ J। λ = hc/ΔE = (6.626×10⁻³⁴ × 3×10⁸)/4.085×10⁻¹⁹ = 4.866×10⁻⁷ m = 486.6 nm (নীলাভ-সবুজ, Hβ)।'],
  ['He⁺ আয়নের কোন স্থানান্তরে H পরমাণুর Hα (৩→২) রেখার সমান তরঙ্গদৈর্ঘ্য পাওয়া যাবে?', 'He⁺: 1/λ = 4R(1/n₁² − 1/n₂²) = R(1/4 − 1/9) হতে হবে ⟹ 1/n₁² − 1/n₂² = 1/16 − 1/36 ⟹ n₁ = ৪, n₂ = ৬। অর্থাৎ He⁺ এর ৬ → ৪ স্থানান্তর।'],
  ['এক মোল H পরমাণুকে n = ১ থেকে n = ২ এ উত্তেজিত করতে কত kJ শক্তি লাগবে?', 'প্রতি পরমাণু: 10.2 eV = 1.634×10⁻¹⁸ J; প্রতি মোল: 1.634×10⁻¹⁸ × 6.022×10²³ = 9.84×10⁵ J = 984 kJ।'],
  ['H পরমাণুর প্রথম কক্ষপথে ইলেকট্রন প্রতি সেকেন্ডে কতবার আবর্তন করে?', 'আবর্তন সংখ্যা = v/2πr = 2.18×10⁶ / (2π × 0.529×10⁻¹⁰) = 6.56×10¹⁵ বার প্রতি সেকেন্ডে।']
],
nq: [
  ['বোর মডেলে শক্তিস্তরের ব্যবধান n বাড়ার সাথে কমে কেন? এর বর্ণালিগত ফল কী?', 'E<sub>n+1</sub> − E<sub>n</sub> = 13.6[1/n² − 1/(n+1)²] = 13.6(2n+1)/[n²(n+1)²], যা n বাড়লে দ্রুত কমে। ফলে উচ্চ স্তরগুলো ঘন হয়ে আসে, এবং প্রতিটি বর্ণালি ধারার রেখাগুলো ছোট তরঙ্গদৈর্ঘ্যের দিকে ক্রমে কাছাকাছি হয়ে একটি সীমায় (series limit) মিলিত হয়।'],
  ['রাদারফোর্ডের পরীক্ষায় ফিরে আসা কণার সংখ্যা স্বর্ণপাতের পুরুত্বের উপর কীভাবে নির্ভর করবে বলে মনে করো?', 'পাত মোটা হলে আলফা কণার পথে বেশি নিউক্লিয়াস পড়বে, তাই নিউক্লিয়াসের খুব কাছ দিয়ে যাওয়ার সম্ভাবনা ও বড় কোণে বিচ্যুতির সংখ্যা প্রায় পুরুত্বের সমানুপাতে বাড়বে। কিন্তু খুব মোটা হলে বহুবার সংঘর্ষে কণা শোষিত হবে বা জটিল পথ নেবে — ফলে সরল বিশ্লেষণ সম্ভব হবে না।'],
  ['r ∝ n²/Z এবং E ∝ Z²/n² — এই দুই সম্পর্ক থেকে প্রমাণ করো যে E ∝ −Z/r।', 'E = −Ze²/(8πε₀r) সরাসরি বোর তত্ত্ব থেকে আসে। অথবা: Z²/n² = Z × (Z/n²) এবং Z/n² ∝ 1/r ⟹ E ∝ −Z/r। অর্থাৎ একই কণায় কক্ষপথ যত দূরে, শক্তি তত কম ঋণাত্মক।']
],
hq: [
  ['কোনো হাইড্রোজেন-সদৃশ আয়নের n = ২ → n = ১ স্থানান্তরে নির্গত তরঙ্গদৈর্ঘ্য H-এর একই স্থানান্তরের ১/৯ ভাগ। আয়নটি শনাক্ত করো।', '1/λ ∝ Z²; λ ∝ 1/Z²। λ<sub>ion</sub> = λ<sub>H</sub>/9 ⟹ Z² = 9 ⟹ Z = 3 ⟹ Li²⁺।'],
  ['যদি প্ল্যাঙ্ক ধ্রুবক h এর মান বর্তমানের দ্বিগুণ হতো, তবে H পরমাণুর আকার ও আয়নীকরণ শক্তিতে কী পরিবর্তন হতো?', 'r ∝ h² ⟹ ব্যাসার্ধ ৪ গুণ হতো (পরমাণু বড়)। E ∝ 1/h² ⟹ আয়নীকরণ শক্তি ১/৪ ভাগ হতো (৩.৪ eV)। ফলে রাসায়নিক বন্ধন দুর্বল হতো এবং দৃশ্যমান আলোর ফোটনেও পরমাণু সহজে আয়নিত হতো।'],
  ['মিউওনিক হাইড্রোজেনে (ইলেকট্রনের বদলে ২০৭ গুণ ভারী মিউওন) প্রথম কক্ষপথের ব্যাসার্ধ কত হবে?', 'r ∝ 1/m (r = ε₀n²h²/πmZe²)। ভর ২০৭ গুণ ⟹ r = 0.529/207 ≈ 2.56×10⁻³ Å = 0.256 pm। (প্রকৃত হিসাবে হ্রাসকৃত ভর ব্যবহার করলে প্রায় ২৮৪ fm।) কক্ষপথ নিউক্লিয়াসের অনেক কাছে চলে আসে।']
],
wp: [
  [2, 'নিউক্লিয়াস কী?', 'পরমাণুর কেন্দ্রে অবস্থিত অতি ক্ষুদ্র (ব্যাসার্ধ ~১০⁻¹³ সেমি), ঘন, ধনাত্মক চার্জযুক্ত অংশ যেখানে প্রোটন ও নিউট্রন থাকে এবং পরমাণুর প্রায় সমস্ত ভর কেন্দ্রীভূত।', 'সংজ্ঞা ১ + বৈশিষ্ট্য (ক্ষুদ্র/ধনাত্মক/ভর) ১', 'শুধু "পরমাণুর কেন্দ্র" লিখলে ১ নম্বর কাটা যায়।'],
  [3, 'পরমাণুর অধিকাংশ স্থান ফাঁকা — রাদারফোর্ডের পরীক্ষার আলোকে ব্যাখ্যা করো।', 'রাদারফোর্ড পাতলা স্বর্ণপাতে আলফা কণা ছুড়ে দেখেন অধিকাংশ কণা কোনো বিচ্যুতি ছাড়াই সোজা চলে যায়। ভারী বা চার্জিত বস্তুর সংস্পর্শে এলে কণাগুলো বেঁকে যেত বা ফিরে আসত। যেহেতু তা হয়নি, তাই পরমাণুর বেশিরভাগ অংশে কোনো বাধা নেই — অর্থাৎ ফাঁকা। ফিরে আসা কণা খুবই কম (≈১/২০০০০), যা প্রমাণ করে ভারী অংশটি (নিউক্লিয়াস) পরমাণুর তুলনায় অতি ক্ষুদ্র।', 'পরীক্ষার উল্লেখ ১ + পর্যবেক্ষণ ১ + যুক্তিসহ সিদ্ধান্ত ১', 'পর্যবেক্ষণ ও সিদ্ধান্তের যুক্তিসংগত সংযোগই নম্বরের মূল।'],
  [5, 'বোর পরমাণু মডেলের স্বীকার্যগুলো লেখো এবং এর দুটি সাফল্য উল্লেখ করো।', '<b>স্বীকার্য:</b><br>১. ইলেকট্রন নিউক্লিয়াসের চারদিকে নির্দিষ্ট শক্তির বৃত্তাকার স্থির কক্ষপথে ঘোরে; সেখানে শক্তি বিকিরণ বা শোষণ করে না।<br>২. শুধু সেসব কক্ষপথ অনুমোদিত যেখানে mvr = nh/2π।<br>৩. উচ্চ স্তর থেকে নিম্ন স্তরে নামলে ΔE = E₂ − E₁ = hν শক্তি বিকিরিত হয়; সমান শক্তি শোষণে নিম্ন থেকে উচ্চ স্তরে ওঠে।<br><b>সাফল্য:</b> (ক) পরমাণুর স্থিতিশীলতা ব্যাখ্যা করে। (খ) হাইড্রোজেনের রেখা বর্ণালি ব্যাখ্যা করে এবং রিডবার্গ ধ্রুবকের তাত্ত্বিক মান দেয়।', 'প্রতিটি স্বীকার্য ১ (মোট ৩) + প্রতিটি সাফল্য ১ (মোট ২)', 'mvr = nh/2π সূত্র ও ΔE = hν অবশ্যই লিখতে হবে।'],
  [7, 'বোর তত্ত্ব ব্যবহার করে হাইড্রোজেন-সদৃশ কণার n-তম কক্ষপথের ব্যাসার্ধ ও শক্তির রাশিমালা প্রতিপাদন করো।', 'ধরি নিউক্লীয় চার্জ Ze, ইলেকট্রনের ভর m, চার্জ e, বেগ v, ব্যাসার্ধ r।<br><b>বলের সাম্য:</b> mv²/r = Ze²/(4πε₀r²) ⟹ mv² = Ze²/(4πε₀r) …(i)<br><b>বোরের শর্ত:</b> mvr = nh/2π ⟹ v = nh/(2πmr) …(ii)<br>(ii) থেকে (i)-এ: m·n²h²/(4π²m²r²) = Ze²/(4πε₀r) ⟹ <b>r = ε₀n²h²/(πmZe²)</b> = 0.529 n²/Z Å।<br><b>শক্তি:</b> KE = ½mv² = Ze²/(8πε₀r) [(i) থেকে]; PE = −Ze²/(4πε₀r)।<br>E = KE + PE = −Ze²/(8πε₀r)। r-এর মান বসিয়ে: <b>E = −mZ²e⁴/(8ε₀²n²h²)</b> = −13.6 Z²/n² eV।', 'বলের সাম্য ১ + বোর শর্ত ১ + r নির্ণয় ২ + KE ও PE ১ + E নির্ণয় ২', 'ধাপ বাদ দিলে নম্বর কাটা যায়; চূড়ান্ত সাংখ্যিক রূপ (0.529 Å, −13.6 eV) লিখলে উত্তর পূর্ণাঙ্গ হয়।'],

L: [
{
  id: 's2a', no: '২.২', t: 'তরঙ্গ বলবিদ্যা: দ্য ব্রগলি, হাইজেনবার্গ ও স্রোডিঞ্জার সমীকরণ',
  v: ['deBroglie'],
  ov: `<p>বোর মডেলে ইলেকট্রন ছিল শুধু একটি ক্ষুদ্র বল। কিন্তু ১৯২০-এর দশকে দেখা গেল ইলেকট্রন <b>তরঙ্গের মতোও</b> আচরণ করে। তরঙ্গের তো নির্দিষ্ট "পথ" থাকে না — তাই ইলেকট্রনের ঠিক অবস্থান ও বেগ একসাথে জানা অসম্ভব। এই নতুন বাস্তবতা গণিতে প্রকাশ করেন <b>শ্রোডিঞ্জার</b> তাঁর তরঙ্গ সমীকরণে, যার সমাধান থেকে পাওয়া যায় অরবিটাল ও কোয়ান্টাম সংখ্যা।</p>`,
  dp: `<h4>১. দ্য ব্রগলির দ্বৈত সত্তা তত্ত্ব (১৯২৪)</h4><p>আলোর যেমন কণা (ফোটন) ও তরঙ্গ — দুই ধর্মই আছে, তেমনি ইলেকট্রনসহ প্রতিটি চলমান বস্তুকণারও তরঙ্গ ধর্ম আছে। m ভরের কণা v বেগে চললে এর সাথে যুক্ত তরঙ্গের দৈর্ঘ্য:</p><div class="eq">λ = h/mv = h/p</div><p><b>উৎপত্তি:</b> আইনস্টাইনের E = mc² এবং প্ল্যাঙ্কের E = hν = hc/λ সমান ধরলে mc² = hc/λ ⟹ λ = h/mc। আলোর বদলে v বেগের কণার জন্য λ = h/mv।</p><p><b>প্রমাণ:</b> ১৯২৭ সালে ডেভিসন ও জারমার নিকেল কেলাসে ইলেকট্রন রশ্মির <b>অপবর্তন (diffraction)</b> দেখান — অপবর্তন কেবল তরঙ্গের ধর্ম। ইলেকট্রন অণুবীক্ষণ যন্ত্র এই ধর্মের উপর ভিত্তি করে কাজ করে।</p><p><b>বড় বস্তুর ক্ষেত্রে:</b> ভর বেশি বলে λ নগণ্য (যেমন ১৬০ g ক্রিকেট বল ৪০ m/s বেগে: λ ≈ ১০⁻³⁴ m), তাই দৈনন্দিন বস্তুর তরঙ্গ ধর্ম চোখে পড়ে না।</p>
  <h4>২. হাইজেনবার্গের অনিশ্চয়তা নীতি (১৯২৭)</h4><p>কোনো গতিশীল ক্ষুদ্র কণার (যেমন ইলেকট্রন) অবস্থান ও ভরবেগ একই সাথে নির্ভুলভাবে নির্ণয় করা অসম্ভব।</p><div class="eq">Δx · Δp ≥ h/4π   বা   Δx · m·Δv ≥ h/4π</div><p>অবস্থান যত নিখুঁতভাবে জানা যায় (Δx ছোট), ভরবেগ তত অনিশ্চিত (Δp বড়) — এবং উল্টোটাও সত্য। কারণ, ইলেকট্রনকে "দেখতে" হলে তার উপর আলো ফেলতে হয়; সেই ফোটনের ধাক্কাই ইলেকট্রনের ভরবেগ বদলে দেয়।</p><p><b>তাৎপর্য:</b> বোরের নির্দিষ্ট বৃত্তাকার কক্ষপথের ধারণা (যেখানে r ও v একসাথে নির্দিষ্ট) বাতিল হয়। ইলেকট্রনের অবস্থান কেবল <b>সম্ভাব্যতা</b> দিয়ে বলা যায় — এখান থেকেই অরবিটাল ধারণা।</p>
  <h4>৩. স্রোডিঞ্জারের তরঙ্গ সমীকরণ (১৯২৬)</h4><p>অস্ট্রিয়ান বিজ্ঞানী আরউইন শ্রোডিঞ্জার ইলেকট্রনকে নিউক্লিয়াসের চারদিকে ত্রিমাত্রিক স্থির তরঙ্গ হিসেবে কল্পনা করে নিচের সমীকরণ দেন:</p><div class="eq">∂²ψ/∂x² + ∂²ψ/∂y² + ∂²ψ/∂z² + (8π²m/h²)(E − V)ψ = 0</div><p>সংক্ষেপে <span class="f">Ĥψ = Eψ</span>, যেখানে Ĥ হ্যামিলটোনিয়ান অপারেটর।</p><ul><li><b>ψ (সাই):</b> তরঙ্গ ফাংশন — ইলেকট্রন তরঙ্গের বিস্তার (amplitude)। ψ-এর নিজস্ব কোনো ভৌত অর্থ নেই।</li><li><b>ψ²:</b> কোনো বিন্দুর চারপাশে একক আয়তনে ইলেকট্রন পাওয়ার <b>সম্ভাব্যতা ঘনত্ব</b> (ম্যাক্স বর্ন-এর ব্যাখ্যা)।</li><li><b>E:</b> ইলেকট্রনের মোট শক্তি; <b>V:</b> বিভব শক্তি; <b>m:</b> ইলেকট্রনের ভর; x, y, z: স্থানাঙ্ক।</li></ul><p>সমীকরণটির গ্রহণযোগ্য সমাধান (ψ একমানবিশিষ্ট, সসীম ও অবিচ্ছিন্ন হতে হবে) কেবল কিছু নির্দিষ্ট শক্তির মানের জন্যই পাওয়া যায়। ফলে <b>শক্তির কোয়ান্টায়ন আপনা-আপনিই চলে আসে</b> — বোরের মতো জোর করে চাপাতে হয় না। প্রতিটি সমাধান তিনটি পূর্ণসংখ্যা n, l, m দিয়ে চিহ্নিত — এরাই কোয়ান্টাম সংখ্যা।</p>`,
  sc: `<h4>সংখ্যাগত উদাহরণ</h4><p><b>(ক)</b> 1.0×10⁶ m s⁻¹ বেগের ইলেকট্রনের তরঙ্গদৈর্ঘ্য:<br>λ = 6.626×10⁻³⁴ / (9.109×10⁻³¹ × 1.0×10⁶) = 7.27×10⁻¹⁰ m = 0.727 nm — পরমাণুর আকারের কাছাকাছি।</p><p><b>(খ)</b> ইলেকট্রনের অবস্থানের অনিশ্চয়তা Δx = 1 Å (10⁻¹⁰ m) হলে বেগের ন্যূনতম অনিশ্চয়তা:<br>Δv ≥ h/(4π m Δx) = 6.626×10⁻³⁴ / (4π × 9.109×10⁻³¹ × 10⁻¹⁰) = 5.79×10⁵ m s⁻¹ — যা ইলেকট্রনের বেগের সাথে তুলনীয়, অর্থাৎ বিশাল অনিশ্চয়তা।</p><p><b>(গ)</b> বোরের শর্তের তরঙ্গ-ব্যাখ্যা: কক্ষপথে স্থির তরঙ্গের জন্য 2πr = nλ = nh/mv ⟹ mvr = nh/2π।</p><div class="note">ব্যতিক্রম/সীমা: স্রোডিঞ্জার সমীকরণ কেবল হাইড্রোজেন ও এক-ইলেকট্রন আয়নের জন্য নিখুঁতভাবে সমাধান করা যায়; বহু-ইলেকট্রন পরমাণুর জন্য আসন্ন (approximate) পদ্ধতি লাগে। স্পিন কোয়ান্টাম সংখ্যা এই সমীকরণ থেকে আসে না — ডিরাকের আপেক্ষিক তত্ত্ব থেকে আসে।</div>`,
  fx: ['λ = h/mv (দ্য ব্রগলি, ১৯২৪)।', 'Δx·Δp ≥ h/4π (হাইজেনবার্গ, ১৯২৭)।', 'স্রোডিঞ্জার সমীকরণ: ১৯২৬; ψ = তরঙ্গ ফাংশন, ψ² = সম্ভাব্যতা ঘনত্ব।', 'ইলেকট্রনের তরঙ্গ ধর্মের প্রমাণ: ডেভিসন-জারমার পরীক্ষা (ইলেকট্রন অপবর্তন)।'],
  ap: ['ইলেকট্রন অণুবীক্ষণ যন্ত্র (TEM, SEM) — ইলেকট্রনের ক্ষুদ্র λ ব্যবহার করে আলোক অণুবীক্ষণের চেয়ে হাজার গুণ বেশি বিবর্ধন।', 'অর্ধপরিবাহী, ট্রানজিস্টর, LED ও লেজার — সবই কোয়ান্টাম বলবিদ্যার প্রয়োগ।', 'কম্পিউটারে অণুর গঠন ও ওষুধের নকশা (কম্পিউটেশনাল কেমিস্ট্রি) স্রোডিঞ্জার সমীকরণের আসন্ন সমাধান দিয়ে করা হয়।'],

  ['একটি কার্বন-১২ পরমাণুর ভর কত গ্রাম?', ['12 g', '1.993×10⁻²³ g', '1.66×10⁻²⁴ g', '7.2×10²⁴ g'], 1, 'm', '12/6.022×10²³ = 1.993×10⁻²³ g।', 's2g'],

  ['বোরনের পারমাণবিক ভর ১০.৮; আইসোটোপ ¹⁰B ও ¹¹B। ¹¹B-এর শতকরা পরিমাণ —', ['২০%', '৫০%', '৮০%', '৯০%'], 2, 'h', '10x + 11(100 − x) = 1080 ⟹ x = ২০% (¹⁰B), ¹¹B = ৮০%।', 's2h'],

  ['²³⁸₉₂U থেকে একটি α কণা নির্গত হলে উৎপন্ন নিউক্লিয়াস —', ['²³⁴₉₀Th', '²³⁴₉₂U', '²³⁸₉₃Np', '²³⁴₉₁Pa'], 0, 'e', 'α নির্গমনে A − 4, Z − 2 ⟹ ²³⁴₉₀Th।', 's2j'],

sq: [
  ['দ্য ব্রগলির দ্বৈত সত্তা তত্ত্বটি লেখো।', 'আলোর মতো প্রতিটি চলমান বস্তুকণারও কণা ও তরঙ্গ — উভয় ধর্ম আছে; m ভরের v বেগের কণার তরঙ্গদৈর্ঘ্য λ = h/mv।'],
  ['হাইজেনবার্গের অনিশ্চয়তা নীতি কী?', 'কোনো গতিশীল অতি ক্ষুদ্র কণার অবস্থান ও ভরবেগ একই সাথে নির্ভুলভাবে নির্ণয় করা সম্ভব নয়: Δx·Δp ≥ h/4π।'],
  ['অরবিটাল কাকে বলে?', 'নিউক্লিয়াসের চারপাশে যে ত্রিমাত্রিক অঞ্চলে ইলেকট্রন পাওয়ার সম্ভাবনা সর্বাধিক (প্রায় ৯০–৯৫%), তাকে অরবিটাল বলে।'],
  ['প্রধান কোয়ান্টাম সংখ্যা কী নির্দেশ করে?', 'ইলেকট্রনের শক্তিস্তর, শক্তিস্তরের আকার, নিউক্লিয়াস থেকে গড় দূরত্ব ও ইলেকট্রনের শক্তি নির্দেশ করে।'],
  ['p উপস্তরে ৬টি ইলেকট্রন থাকে কেন?', 'p-এর জন্য l = ১, তাই m = −১, ০, +১ — তিনটি অরবিটাল। প্রতিটিতে বিপরীত স্পিনের দুটি ইলেকট্রন থাকে (পাউলি), তাই 3 × 2 = ৬টি।'],
  ['পারমাণবিক সংখ্যা ও ভর সংখ্যার পার্থক্য লেখো।', 'পারমাণবিক সংখ্যা = নিউক্লিয়াসের প্রোটন সংখ্যা, যা মৌলের পরিচয় দেয়; ভর সংখ্যা = প্রোটন ও নিউট্রনের মোট সংখ্যা, একই মৌলের আইসোটোপে ভিন্ন হতে পারে।'],
  ['আইসোটোন কাকে বলে? উদাহরণ দাও।', 'যেসব ভিন্ন মৌলের পরমাণুর নিউট্রন সংখ্যা সমান, তাদের আইসোটোন বলে। যেমন ¹⁴C, ¹⁵N, ¹⁶O (প্রত্যেকে ৮টি নিউট্রন)।'],
  ['আপেক্ষিক পারমাণবিক ভরের একক নেই কেন?', 'এটি একটি পরমাণুর ভর ও ¹²C পরমাণুর ভরের ১/১২ অংশের অনুপাত; দুটি একই জাতীয় রাশির অনুপাত বলে একক কেটে যায়।'],
  ['পারমাণবিক ভর ভগ্নাংশ হয় কেন?', 'প্রকৃতিতে মৌলগুলো একাধিক আইসোটোপের মিশ্রণ; পারমাণবিক ভর তাদের প্রাচুর্য-ভারিত গড়, তাই ভগ্নাংশ হয়। এছাড়া ভর ত্রুটির কারণেও আইসোটোপের ভর পূর্ণসংখ্যা নয়।'],
  ['অর্ধায়ু কাকে বলে?', 'যে সময়ে কোনো তেজস্ক্রিয় পদার্থের প্রাথমিক পরমাণুর অর্ধেক ক্ষয়প্রাপ্ত হয়, তাকে ঐ পদার্থের অর্ধায়ু বলে।'],
  ['β কণা নির্গমনে পারমাণবিক সংখ্যা বাড়ে কেন?', 'নিউক্লিয়াসের একটি নিউট্রন প্রোটন ও ইলেকট্রনে ভেঙে যায় (n → p + e⁻); ইলেকট্রনটি β কণা হিসেবে বেরিয়ে যায় আর প্রোটনটি নিউক্লিয়াসে থাকে, ফলে প্রোটন সংখ্যা (Z) ১ বাড়ে।']
],
cq: [
  { s: 'X, Y ও Z তিনটি পরমাণু: ³⁵₁₇X, ³⁷₁₇Y, ⁴⁰₁₈Z। প্রকৃতিতে X ও Y যথাক্রমে ৭৫% ও ২৫% অনুপাতে পাওয়া যায়।', p: [
    ['আইসোটোপ কাকে বলে?', 'একই মৌলের যেসব পরমাণুর প্রোটন সংখ্যা সমান কিন্তু ভর সংখ্যা (নিউট্রন সংখ্যা) ভিন্ন, তাদের আইসোটোপ বলে।'],
    ['Y ও Z এর মধ্যে সম্পর্ক কী? ব্যাখ্যা করো।', 'Y (³⁷₁₇Cl): নিউট্রন = 37 − 17 = ২০। Z (⁴⁰₁₈Ar): নিউট্রন = 40 − 18 = ২২। নিউট্রন সংখ্যা ভিন্ন, ভর সংখ্যাও ভিন্ন, প্রোটনও ভিন্ন — তাই এরা আইসোটোপ, আইসোবার বা আইসোটোন কোনোটিই নয়; এরা দুটি ভিন্ন মৌলের পরমাণু (Cl ও Ar)। তবে Y⁻ আয়ন (১৮টি e⁻) ও Z (১৮টি e⁻) পরস্পর আইসোইলেকট্রনিক।'],
    ['উদ্দীপকের মৌলটির গড় পারমাণবিক ভর নির্ণয় করো।', 'X ও Y একই মৌলের (Z = ১৭, ক্লোরিন) আইসোটোপ।<br>গড় পারমাণবিক ভর = (35 × 75 + 37 × 25)/100 = (2625 + 925)/100 = <b>35.5</b>'],
    ['X ও Y এর রাসায়নিক ধর্ম একই হলেও ভৌত ধর্ম ভিন্ন — বিশ্লেষণ করো।', 'X (³⁵Cl) ও Y (³⁷Cl) উভয়ের প্রোটন ১৭, নিরপেক্ষ অবস্থায় ইলেকট্রন ১৭, বিন্যাস 1s² 2s² 2p⁶ 3s² 3p⁵। রাসায়নিক বিক্রিয়ায় কেবল যোজ্যতা ইলেকট্রন অংশ নেয়; যোজ্যতা স্তরের বিন্যাস (3s² 3p⁵) অভিন্ন বলে উভয়ে একইভাবে একটি ইলেকট্রন গ্রহণ করে Cl⁻ বা একটি সমযোজী বন্ধন গঠন করে — রাসায়নিক ধর্ম একই।<br>কিন্তু Y-তে দুটি নিউট্রন বেশি, তাই Y-এর পরমাণুর ভর বেশি। ভরের উপর নির্ভরশীল ধর্ম — ঘনত্ব, ব্যাপনের হার (গ্রাহামের সূত্র অনুযায়ী ভারী অণু ধীরে ব্যাপিত হয়), গলনাঙ্ক-স্ফুটনাঙ্ক ও ভর বর্ণালিতে অবস্থান — ভিন্ন হয়। যেমন H³⁵Cl ও H³⁷Cl-এর IR শোষণ সামান্য ভিন্ন। সুতরাং X ও Y রাসায়নিকভাবে অভিন্ন কিন্তু ভৌতভাবে ভিন্ন।']
  ] },
  { s: 'একটি মৌলের শেষ ইলেকট্রনের চারটি কোয়ান্টাম সংখ্যা: n = ৩, l = ১, m = ০, s = +½ (m-এর মান −l থেকে পূরণের প্রথা অনুযায়ী)।', p: [
    ['চৌম্বকীয় কোয়ান্টাম সংখ্যা কী?', 'যে কোয়ান্টাম সংখ্যা কোনো উপস্তরের অরবিটাল সংখ্যা ও ত্রিমাত্রিক স্থানে তাদের দিকবিন্যাস নির্দেশ করে; মান −l থেকে +l।'],
    ['n = ৩ শক্তিস্তরে সর্বোচ্চ ১৮টি ইলেকট্রন থাকে কেন?', 'n = ৩ হলে l = ০, ১, ২ — 3s, 3p, 3d উপস্তর। অরবিটাল সংখ্যা ১ + ৩ + ৫ = ৯ (= n²)। প্রতিটিতে দুটি ইলেকট্রন ⟹ সর্বোচ্চ ১৮ (= 2n²)।'],
    ['উদ্দীপকের মৌলটি শনাক্ত করে এর ইলেকট্রন বিন্যাস লেখো।', 'শেষ ইলেকট্রন 3p উপস্তরে (n = ৩, l = ১)। m = ০ এবং s = +½ মানে 3p-এর দ্বিতীয় অরবিটালে প্রথম ইলেকট্রন, অর্থাৎ 3p² (প্রথা: m = −১ থেকে, প্রথমে +½)।<br>ইলেকট্রন বিন্যাস: 1s² 2s² 2p⁶ 3s² 3p² ⟹ মোট ১৪টি ইলেকট্রন ⟹ মৌলটি সিলিকন (Si, Z = ১৪)।'],
    ['মৌলটির যোজ্যতা ইলেকট্রনগুলোর জন্য সম্ভাব্য সকল কোয়ান্টাম সংখ্যার সেট লেখো এবং পাউলির নীতি অনুযায়ী এগুলো বিশ্লেষণ করো।', 'Si-এর যোজ্যতা ইলেকট্রন: 3s² 3p² (মোট ৪টি)।<br>3s-এর দুটি: (৩, ০, ০, +½) ও (৩, ০, ০, −½)।<br>3p-এর দুটি (হুন্ডের নীতি অনুযায়ী আলাদা অরবিটালে সমান্তরাল স্পিনে): (৩, ১, −১, +½) ও (৩, ১, ০, +½)।<br>বিশ্লেষণ: চারটি সেটের কোনো দুটির চারটি সংখ্যাই অভিন্ন নয় — 3s-এর দুটির s ভিন্ন, 3p-এর দুটির m ভিন্ন। তাই পাউলির বর্জন নীতি রক্ষিত। যদি 3p-এর দুটি ইলেকট্রন একই অরবিটালে (m = −১) থাকত, তবে s অবশ্যই বিপরীত হতো; কিন্তু হুন্ডের নীতি অনুযায়ী আলাদা অরবিটালে থাকাই কম শক্তির অবস্থা। ফলে Si-এর ২টি অযুগ্ম ইলেকট্রন থাকে।']
  ] },
  { s: 'একটি তেজস্ক্রিয় আইসোটোপ ²¹⁰₈₄Po থেকে একটি কণা নির্গত হয়ে ²⁰⁶₈₂Pb উৎপন্ন হয়। Po-এর অর্ধায়ু ১৩৮ দিন।', p: [
    ['তেজস্ক্রিয়তা কাকে বলে?', 'অস্থিতিশীল নিউক্লিয়াস থেকে স্বতঃস্ফূর্তভাবে α, β বা γ রশ্মি নির্গত হয়ে নতুন নিউক্লিয়াস গঠনের প্রক্রিয়াকে তেজস্ক্রিয়তা বলে।'],
    ['উদ্দীপকে কোন কণা নির্গত হয়েছে? ব্যাখ্যা করো।', 'A কমেছে 210 − 206 = ৪ এবং Z কমেছে 84 − 82 = ২। এটি ⁴₂He অর্থাৎ α কণার বৈশিষ্ট্য। বিক্রিয়া: ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He।'],
    ['২০ g Po থেকে ৪১৪ দিন পর কত গ্রাম অবশিষ্ট থাকবে?', 'n = 414/138 = ৩<br>অবশিষ্ট = 20 × (½)³ = 20/8 = <b>2.5 g</b>'],
    ['নির্গত কণাটির সাথে β ও γ রশ্মির ধর্মের তুলনা করে দেখাও এটি দেহের বাইরে থাকলে কম ক্ষতিকর কিন্তু দেহের ভেতরে গেলে সবচেয়ে বিপজ্জনক।', 'নির্গত কণা α (He²⁺, +২ চার্জ, ৪ amu)।<br>তুলনা: ভেদনক্ষমতা α &lt; β &lt; γ; আয়নায়ন ক্ষমতা α &gt; β &gt; γ।<br>দেহের বাইরে: α কাগজ বা ত্বকের মৃত কোষের স্তরেই থেমে যায়, তাই জীবিত কোষে পৌঁছায় না — তুলনামূলক নিরাপদ। অথচ γ দেহ ভেদ করে অভ্যন্তরীণ অঙ্গের ক্ষতি করতে পারে।<br>দেহের ভেতরে (শ্বাস বা খাদ্যের মাধ্যমে): α উৎস সরাসরি কোষের পাশে থাকে। এর আয়নায়ন ক্ষমতা সবচেয়ে বেশি — খুব অল্প দূরত্বে সমস্ত শক্তি জমা করে বহু অণু আয়নিত করে, DNA-তে দ্বি-সূত্র ভাঙন ঘটায়; ফলে স্থানীয় ক্ষতি β বা γ-এর তুলনায় বহু গুণ বেশি। এ কারণে ²¹⁰Po খুব বিষাক্ত হিসেবে পরিচিত। সুতরাং α-এর বিপদ এর অবস্থানের উপর নির্ভর করে — উক্তিটি যথার্থ।']
  ] },
  { s: 'একটি পরমাণুর নিউক্লিয়াসে ২৬টি প্রোটন ও ৩০টি নিউট্রন আছে। এটি দুটি আয়ন গঠন করে: A²⁺ ও A³⁺।', p: [
    ['ভর সংখ্যা কাকে বলে?', 'কোনো পরমাণুর নিউক্লিয়াসে উপস্থিত প্রোটন ও নিউট্রনের মোট সংখ্যাকে ভর সংখ্যা বলে।'],
    ['A²⁺ ও A³⁺ এর ভর সংখ্যা একই কেন?', 'আয়ন গঠনে শুধু বাইরের ইলেকট্রন সরে যায়; নিউক্লিয়াসের প্রোটন ও নিউট্রন অপরিবর্তিত থাকে। ভর সংখ্যা = p + n = ২৬ + ৩০ = ৫৬ — উভয় আয়নের জন্য একই।'],
    ['আয়ন দুটির ইলেকট্রন সংখ্যা ও ইলেকট্রন বিন্যাস লেখো।', 'মৌলটি Fe (Z = ২৬): [Ar] 3d⁶ 4s²।<br>A²⁺ (Fe²⁺): ইলেকট্রন ২৪; আগে 4s থেকে দুটি সরে: [Ar] 3d⁶।<br>A³⁺ (Fe³⁺): ইলেকট্রন ২৩; [Ar] 3d⁵।'],
    ['কোন আয়নটি বেশি স্থিতিশীল? কোয়ান্টাম সংখ্যা ও হুন্ডের নীতির আলোকে বিশ্লেষণ করো।', 'Fe³⁺ = [Ar] 3d⁵ — পাঁচটি d অরবিটালের প্রতিটিতে একটি করে ইলেকট্রন সমান্তরাল স্পিনে (s = +½, m = −২ থেকে +২)। এই অর্ধপূর্ণ বিন্যাস প্রতিসম; সমান্তরাল স্পিনের ইলেকট্রনগুলোর মধ্যে সর্বাধিক বিনিময় শক্তি থাকে এবং কোনো অরবিটালে জোড় বাঁধার বিকর্ষণ নেই — তাই বিশেষ স্থিতিশীল।<br>Fe²⁺ = 3d⁶ — একটি অরবিটালে জোড় বাঁধা ইলেকট্রন (+½ ও −½) আছে; জোড় বিকর্ষণের কারণে এটি একটি ইলেকট্রন ছেড়ে 3d⁵ হতে চায়। এজন্য বাতাসে Fe²⁺ লবণ সহজে Fe³⁺-এ জারিত হয় (যেমন সবুজ FeSO₄ দ্রবণ ধীরে বাদামি হয়)।<br>সুতরাং Fe³⁺ বেশি স্থিতিশীল।']
  ] },
  { s: 'একজন শিক্ষার্থী পড়ছিল — "ইলেকট্রনকে দেখতে হলে এর উপর আলো ফেলতে হয়। ছোট তরঙ্গদৈর্ঘ্যের আলো ফেললে অবস্থান নিখুঁতভাবে জানা যায়, কিন্তু ফোটনের ধাক্কায় ইলেকট্রনের বেগ বদলে যায়।" [h = 6.626×10⁻³⁴ J s, m<sub>e</sub> = 9.109×10⁻³¹ kg]', p: [
    ['স্রোডিঞ্জার সমীকরণে ψ কী?', 'ψ হলো তরঙ্গ ফাংশন — ইলেকট্রন তরঙ্গের বিস্তার; ψ² ইলেকট্রন পাওয়ার সম্ভাব্যতা ঘনত্ব।'],
    ['উদ্দীপকের ঘটনাটি কোন নীতি নির্দেশ করে? ব্যাখ্যা করো।', 'হাইজেনবার্গের অনিশ্চয়তা নীতি। ছোট λ-এর ফোটনের ভরবেগ (h/λ) বেশি, তাই অবস্থান নিখুঁত হলেও সংঘর্ষে ইলেকট্রনের ভরবেগ অনেক বদলে যায়; বড় λ ব্যবহার করলে ভরবেগ কম বদলায় কিন্তু অবস্থান অস্পষ্ট হয়। ফলে দুটি একসাথে নিখুঁত জানা যায় না: Δx·Δp ≥ h/4π।'],
    ['একটি ইলেকট্রনের অবস্থানের অনিশ্চয়তা 0.1 nm হলে বেগের ন্যূনতম অনিশ্চয়তা নির্ণয় করো।', 'Δv ≥ h/(4π m Δx) = 6.626×10⁻³⁴ / (4 × 3.1416 × 9.109×10⁻³¹ × 1×10⁻¹⁰)<br>= 6.626×10⁻³⁴ / 1.1447×10⁻³⁹ = <b>5.79×10⁵ m s⁻¹</b>'],
    ['উদ্দীপকের নীতিটি বোর মডেলের কক্ষপথ ধারণাকে কীভাবে প্রশ্নবিদ্ধ করে এবং অরবিটাল ধারণার জন্ম দেয় — বিশ্লেষণ করো।', 'বোর মডেলে ইলেকট্রন নির্দিষ্ট ব্যাসার্ধের (r) বৃত্তাকার পথে নির্দিষ্ট বেগে (v) ঘোরে — অর্থাৎ যেকোনো মুহূর্তে অবস্থান ও ভরবেগ দুটোই নিখুঁতভাবে জানা। কিন্তু (গ)-এর হিসাব দেখায় পরমাণুর আকারের (~0.1 nm) মধ্যে অবস্থান জানলে বেগের অনিশ্চয়তা ~6×10⁵ m s⁻¹, যা H-এর প্রথম কক্ষপথের বেগের (2.18×10⁶ m s⁻¹) সাথে তুলনীয়। ফলে "নির্দিষ্ট বেগে নির্দিষ্ট পথ" অর্থহীন হয়ে পড়ে।<br>তাই নির্দিষ্ট পথের বদলে প্রশ্ন দাঁড়ায় — কোথায় ইলেকট্রন পাওয়ার সম্ভাবনা কত? স্রোডিঞ্জার সমীকরণের ψ² এই সম্ভাব্যতা দেয়। যে ত্রিমাত্রিক অঞ্চলে সম্ভাবনা সর্বাধিক, সেটিই অরবিটাল। এভাবে অনিশ্চয়তা নীতি বোরের অরবিট বাতিল করে অরবিটাল ধারণার ভিত্তি তৈরি করেছে।']
  ] }

  ['২৪ g কার্বন-১২ এ কতটি পরমাণু আছে এবং একটি পরমাণুর ভর কত?', 'মোল = 24/12 = ২; পরমাণু = 2 × 6.022×10²³ = 1.204×10²⁴টি; একটির ভর = 12/6.022×10²³ = 1.993×10⁻²³ g।'],

nq: [
  ['n = ৪ শক্তিস্তরের জন্য উপস্তর, অরবিটাল ও ইলেকট্রন ধারণক্ষমতা বিশ্লেষণ করে দেখাও যে মোট ইলেকট্রন 2n²।', 'l = ০, ১, ২, ৩ → 4s, 4p, 4d, 4f। অরবিটাল ১ + ৩ + ৫ + ৭ = ১৬ = ৪²। ইলেকট্রন ২ + ৬ + ১০ + ১৪ = ৩২ = 2×৪²। সাধারণভাবে Σ(2l+1) (l = ০…n−1) = n², তাই ইলেকট্রন 2n²।'],
  ['α নির্গমনে n/p অনুপাত কীভাবে বদলায়? ²³⁸U → ²³⁴Th উদাহরণে দেখাও।', '²³⁸U: p = ৯২, n = ১৪৬, n/p = 1.587। ²³⁴Th: p = ৯০, n = ১৪৪, n/p = 1.600। α নির্গমনে p ও n দুটোই ২ কমে, ফলে ভারী নিউক্লিয়াসে n/p সামান্য বাড়ে — তাই α ক্ষয়ের পর প্রায়ই β⁻ ক্ষয় ঘটে n/p কমাতে।'],

  ['প্রমাণ করো: একটি তেজস্ক্রিয় নমুনার ৯৯.৯% ক্ষয় হতে প্রায় ১০টি অর্ধায়ু লাগে।', 'অবশিষ্ট 0.1% = 0.001 = (½)ⁿ ⟹ n = log(1000)/log 2 = 3/0.301 = 9.97 ≈ ১০। তাই নিরাপদ বর্জ্য সংরক্ষণে সাধারণত ১০ অর্ধায়ু সময় ধরা হয়।'],
  ['ভারী পানি (D₂O) সাধারণ পানির চেয়ে প্রায় ১১% ঘন কেন? হিসাব করে দেখাও।', 'H₂O-এর আণবিক ভর ১৮, D₂O-এর ২০। অণুর আকার প্রায় একই (একই ইলেকট্রন মেঘ), তাই একই আয়তনে প্রায় সমান সংখ্যক অণু থাকে; ঘনত্ব আণবিক ভরের অনুপাতে বাড়ে: 20/18 = 1.11 ⟹ প্রায় ১১% বেশি (প্রকৃত ঘনত্ব 1.107 g/mL)।']

  [7, 'আইসোটোপের প্রাচুর্য থেকে কীভাবে গড় পারমাণবিক ভর নির্ণয় করা হয়? ম্যাগনেসিয়ামের উদাহরণসহ ব্যাখ্যা করো এবং পারমাণবিক ভর ভগ্নাংশ হওয়ার কারণ লেখো।', '<b>নীতি:</b> প্রকৃতিতে মৌল তার আইসোটোপগুলোর নির্দিষ্ট অনুপাতের মিশ্রণ। ভর বর্ণালিমাপক যন্ত্রে প্রতিটি আইসোটোপের ভর (M) ও শতকরা প্রাচুর্য (x) মাপা হয়। গড় পারমাণবিক ভর = Σ(M·x)/100।<br><b>উদাহরণ:</b> ²⁴Mg (23.985, 78.99%), ²⁵Mg (24.986, 10.00%), ²⁶Mg (25.983, 11.01%)।<br>গড় = (1894.6 + 249.9 + 286.1)/100 = <b>24.31</b>।<br><b>ভগ্নাংশের কারণ:</b> (১) একাধিক আইসোটোপের প্রাচুর্য-ভারিত গড়; (২) প্রোটন ও নিউট্রনের ভর ঠিক ১ amu নয় এবং নিউক্লিয়াস গঠনে ভর ত্রুটি হয়।', 'নীতি ও সূত্র ২ + উদাহরণের হিসাব ৩ + কারণ ২', 'হিসাবের প্রতিটি গুণফল আলাদা লেখো; শেষ উত্তর দশমিকের দুই ঘর পর্যন্ত।'],
  [10, 'কোয়ান্টাম বলবিদ্যা পরমাণু মডেলের মূল ধারণাগুলো (দ্য ব্রগলি, হাইজেনবার্গ, স্রোডিঞ্জার) আলোচনা করো এবং এই মডেল থেকে কীভাবে চারটি কোয়ান্টাম সংখ্যা ও অরবিটাল ধারণা এসেছে তা ব্যাখ্যা করো।', '<b>১. দ্য ব্রগলি (১৯২৪):</b> চলমান কণার তরঙ্গ ধর্ম, λ = h/mv; ইলেকট্রন অপবর্তনে প্রমাণিত। ফলে ইলেকট্রনকে পরমাণুতে স্থির তরঙ্গ হিসেবে ভাবা যায়।<br><b>২. হাইজেনবার্গ (১৯২৭):</b> Δx·Δp ≥ h/4π — নির্দিষ্ট কক্ষপথ অসম্ভব; কেবল সম্ভাব্যতা।<br><b>৩. স্রোডিঞ্জার (১৯২৬):</b> ∇²ψ + (8π²m/h²)(E − V)ψ = 0। গ্রহণযোগ্য সমাধান কেবল নির্দিষ্ট E-তে — কোয়ান্টায়ন স্বাভাবিকভাবে আসে।<br><b>৪. কোয়ান্টাম সংখ্যা:</b> ত্রিমাত্রিক সমাধানে তিনটি পূর্ণসংখ্যা লাগে — n (শক্তি ও আকার), l (আকৃতি, ০…n−1), m (দিক, −l…+l)। স্পিন s = ±½ পরে যুক্ত হয় (উলেনবেক-গাউডস্মিট, ডিরাক)।<br><b>৫. অরবিটাল:</b> প্রতিটি (n, l, m) সমাধান ψ একটি অরবিটাল; ψ² সম্ভাব্যতা ঘনত্ব; যে অঞ্চলে সম্ভাবনা ৯০–৯৫%, সেটিই অরবিটালের আকৃতি — s গোলাকার, p ডাম্বেল, d দ্বি-ডাম্বেল। নোড: রেডিয়াল n−l−1, কৌণিক l।<br><b>৬. সাফল্য:</b> বহু-ইলেকট্রন পরমাণু, জিম্যান প্রভাব, সূক্ষ্ম রেখা, বন্ধন ও অণুর আকৃতি — সব ব্যাখ্যা করে।<br><b>উপসংহার:</b> তিনটি ধারণা মিলে ইলেকট্রনকে "পথে চলা কণা" থেকে "সম্ভাব্যতার তরঙ্গ" হিসেবে প্রতিষ্ঠা করেছে।', 'দ্য ব্রগলি ১.৫ + হাইজেনবার্গ ১.৫ + স্রোডিঞ্জার ২ + কোয়ান্টাম সংখ্যা ২ + অরবিটাল ২ + উপসংহার ১', 'সমীকরণগুলোর প্রতীক ব্যাখ্যা ও যৌক্তিক ধারাবাহিকতা (তরঙ্গ → অনিশ্চয়তা → সমীকরণ → কোয়ান্টাম সংখ্যা) রাখলে পূর্ণ নম্বর।']

  ['s অরবিটাল দিক-নিরপেক্ষ কেন?', 's অরবিটাল গোলাকার; নিউক্লিয়াস থেকে সব দিকে ইলেকট্রন ঘনত্ব সমান, তাই কোনো নির্দিষ্ট দিক নেই।'],
  ['নোডাল তল কী?', 'নিউক্লিয়াসের মধ্য দিয়ে যাওয়া যে তলে ইলেকট্রন পাওয়ার সম্ভাবনা শূন্য (ψ = 0), তাকে নোডাল তল বা কৌণিক নোড বলে।'],
  ['অরবিট ও অরবিটালের দুটি পার্থক্য লেখো।', '১. অরবিট দ্বিমাত্রিক নির্দিষ্ট পথ, অরবিটাল ত্রিমাত্রিক সম্ভাব্যতার অঞ্চল। ২. অরবিটে 2n² টি, অরবিটালে সর্বোচ্চ ২টি ইলেকট্রন থাকে।'],
  ['আবরণী প্রভাব কী?', 'বহু-ইলেকট্রন পরমাণুতে ভেতরের ইলেকট্রনগুলো নিউক্লিয়াসের আকর্ষণ থেকে বাইরের ইলেকট্রনকে আংশিক আড়াল করে রাখে — একে আবরণী বা স্ক্রিনিং প্রভাব বলে।'],
  ['d অরবিটালগুলোর নাম লেখো।', 'd<sub>xy</sub>, d<sub>yz</sub>, d<sub>xz</sub>, d<sub>x²−y²</sub>, d<sub>z²</sub>।']
],
cq: [
  { s: 'একটি মৌল X এর শেষ ইলেকট্রন n = ৩, l = ২ বিশিষ্ট উপস্তরে প্রবেশ করে। অপর মৌল Y এর শেষ ইলেকট্রন n = ৪, l = ০ বিশিষ্ট উপস্তরে প্রবেশ করে।', p: [
    ['অরবিটাল কাকে বলে?', 'নিউক্লিয়াসের চারপাশের যে ত্রিমাত্রিক অঞ্চলে ইলেকট্রন পাওয়ার সম্ভাবনা সর্বাধিক, তাকে অরবিটাল বলে।'],
    ['X ও Y এর শেষ ইলেকট্রন যে উপস্তরে প্রবেশ করে, তাদের মধ্যে কোনটি আগে পূর্ণ হয়? ব্যাখ্যা করো।', 'X: n = ৩, l = ২ → 3d; (n + l) = ৫। Y: n = ৪, l = ০ → 4s; (n + l) = ৪। (n + l) কম বলে 4s এর শক্তি কম, তাই Y এর উপস্তর (4s) আগে পূর্ণ হয়।'],
    ['X এর শেষ উপস্তরের অরবিটালগুলোর আকৃতি চিত্রসহ বর্ণনা করো।', '3d উপস্তরে পাঁচটি অরবিটাল (m = −২…+২):<br>d<sub>xy</sub>, d<sub>yz</sub>, d<sub>xz</sub> — প্রতিটির চারটি লোব সংশ্লিষ্ট দুই অক্ষের মাঝখানে ৪৫° কোণে।<br>d<sub>x²−y²</sub> — চারটি লোব x ও y অক্ষ বরাবর।<br>d<sub>z²</sub> — z অক্ষ বরাবর দুটি লোব এবং xy তলে একটি বলয়।<br>প্রতিটিতে দুটি কৌণিক নোড (l = ২)।<br>[চিত্র: পাঠের "s, p ও d অরবিটালের আকৃতি" চিত্রের নিচের সারি অনুসরণ করে অক্ষসহ আঁকো।]'],
    ['Y মৌলের পরের মৌলগুলোতে X এর উপস্তর পূর্ণ হয়, কিন্তু আয়ন গঠনের সময় Y এর উপস্তর থেকে আগে ইলেকট্রন সরে যায় — বিশ্লেষণ করো।', 'নিরপেক্ষ পরমাণুতে ইলেকট্রন সংযোজনের সময় (n + l) নিয়মে 4s (Y এর উপস্তর) এর শক্তি 3d এর চেয়ে কম, তাই K, Ca তে 4s পূর্ণ হয়, তারপর Sc থেকে Zn পর্যন্ত 3d পূর্ণ হয়।<br>কিন্তু 3d অরবিটালে ইলেকট্রন প্রবেশ করলে নিউক্লীয় চার্জ বৃদ্ধির সাথে 3d ইলেকট্রনগুলো ভেতরের দিকে সংকুচিত হয় এবং 4s ইলেকট্রনকে আংশিক আড়াল করে। ফলে ট্রানজিশন ধাতুতে 3d এর শক্তি 4s এর নিচে নেমে যায়; তাছাড়া 4s ইলেকট্রন নিউক্লিয়াস থেকে গড়ে বেশি দূরে (n = ৪)।<br>আয়নীকরণে সবচেয়ে বাইরের ও শিথিলভাবে আবদ্ধ ইলেকট্রন আগে সরে, তাই 4s ইলেকট্রন আগে যায়। যেমন Fe: [Ar] 3d⁶ 4s² → Fe²⁺: [Ar] 3d⁶। সুতরাং "পরে পূর্ণ হয় কিন্তু পরে খালি হয়" — এটি (n + l) নিয়ম ও প্রকৃত শক্তির পার্থক্যের ফল।']
  ] },
  { s: 'শিক্ষক বোর্ডে দুটি চিত্র আঁকলেন: চিত্র-১ — নিউক্লিয়াসের চারদিকে একটি বৃত্তাকার রেখা, তাতে একটি ইলেকট্রন। চিত্র-২ — নিউক্লিয়াসের চারদিকে বিন্দুর মেঘ, কেন্দ্রের কাছে ঘন ও বাইরে পাতলা।', p: [
    ['প্রধান কোয়ান্টাম সংখ্যা কী নির্দেশ করে?', 'শক্তিস্তর, এর আকার ও শক্তি এবং নিউক্লিয়াস থেকে ইলেকট্রনের গড় দূরত্ব।'],
    ['চিত্র-১ এর ধারণাটি অনিশ্চয়তা নীতির পরিপন্থী কেন?', 'চিত্র-১ (অরবিট) অনুযায়ী ইলেকট্রন নির্দিষ্ট ব্যাসার্ধের পথে নির্দিষ্ট বেগে চলে, অর্থাৎ অবস্থান ও ভরবেগ একসাথে নির্দিষ্ট। হাইজেনবার্গের নীতি অনুযায়ী এটি অসম্ভব — তাই পরিপন্থী।'],
    ['চিত্র-২ এর অঞ্চলে কয়টি ইলেকট্রন থাকতে পারে এবং তাদের কোয়ান্টাম সংখ্যা কী হবে (ধরি এটি 1s)?', 'চিত্র-২ একটি অরবিটাল (1s)। সর্বোচ্চ ২টি ইলেকট্রন: (n = ১, l = ০, m = ০, s = +½) এবং (১, ০, ০, −½)। পাউলির নীতি অনুযায়ী তৃতীয় ইলেকট্রন সম্ভব নয়।'],
    ['চিত্র দুটির তুলনামূলক বিশ্লেষণ করে কোনটি আধুনিক বিজ্ঞানে গ্রহণযোগ্য তা যুক্তিসহ দেখাও।', 'চিত্র-১: বোরের অরবিট — দ্বিমাত্রিক নির্দিষ্ট পথ, 2n² ধারণক্ষমতা, শুধু n দিয়ে প্রকাশ, অনিশ্চয়তা নীতির পরিপন্থী, বহু-ইলেকট্রন পরমাণু ও অণুর আকৃতি ব্যাখ্যায় অক্ষম।<br>চিত্র-২: অরবিটাল — ত্রিমাত্রিক সম্ভাব্যতার মেঘ, স্রোডিঞ্জার সমীকরণের ψ² থেকে প্রাপ্ত, n, l, m দিয়ে প্রকাশ, অনিশ্চয়তা নীতি ও দ্বৈত সত্তার সাথে সঙ্গতিপূর্ণ; s, p, d আকৃতি দিয়ে বন্ধন ও অণুর জ্যামিতি ব্যাখ্যা করে।<br>মজার মিল: চিত্র-২ এর রেডিয়াল বণ্টনের সর্বোচ্চ বিন্দু চিত্র-১ এর ব্যাসার্ধে (0.529 Å)। অর্থাৎ চিত্র-১ চিত্র-২ এর একটি সরলীকৃত রূপ।<br>সিদ্ধান্ত: পরীক্ষালব্ধ তথ্য (ইলেকট্রন অপবর্তন, জিম্যান প্রভাব, বর্ণালির সূক্ষ্ম গঠন) চিত্র-২ কেই সমর্থন করে — তাই চিত্র-২ (অরবিটাল) আধুনিক বিজ্ঞানে গ্রহণযোগ্য।']
  ] },
  { s: 'নিচের উপস্তরগুলো দেওয়া আছে: 4p, 5s, 4d, 3d, 6s, 4f।', p: [
    ['ভেদন ক্ষমতা কী?', 'কোনো অরবিটালের ইলেকট্রন ভেতরের ইলেকট্রন স্তর ভেদ করে নিউক্লিয়াসের কত কাছে যেতে পারে তার পরিমাপ; একই n-এ s > p > d > f।'],
    ['5s ও 4d এর মধ্যে কোনটির শক্তি বেশি? ব্যাখ্যা করো।', '5s: ৫ + ০ = ৫; 4d: ৪ + ২ = ৬। 4d এর (n + l) বেশি বলে শক্তি বেশি; 5s আগে পূর্ণ হয় (Rb, Sr), তারপর 4d (Y থেকে)।'],
    ['উদ্দীপকের উপস্তরগুলোকে শক্তির ঊর্ধ্বক্রমে সাজাও।', '(n + l): 3d = ৫ (n=৩), 4p = ৫ (n=৪), 5s = ৫ (n=৫), 4d = ৬ (n=৪), 6s = ৬ (n=৬), 4f = ৭।<br>ক্রম: <b>3d < 4p < 5s < 4d < 6s < 4f</b>'],
    ['একই (n + l) মানের উপস্তরগুলোর মধ্যে n কম হলে শক্তি কম কেন — ভেদন ও আবরণের ধারণায় বিশ্লেষণ করো।', '(n + l) সমান মানে n কম হলে l বেশি (যেমন 3d বনাম 4p বনাম 5s)। দুটি বিপরীত প্রভাব কাজ করে: n বাড়লে অরবিটাল বড় ও নিউক্লিয়াস থেকে দূরে → শক্তি বাড়ে; l বাড়লে ভেদন কমে → আবরণ বেশি → শক্তি বাড়ে। (n + l) সমান হলে দেখা যায় n-এর প্রভাব প্রাধান্য পায় — বড় n-এর অরবিটালের গড় দূরত্ব এত বেশি যে ভালো ভেদন থাকা সত্ত্বেও তার শক্তি বেশি থাকে। যেমন 3d (n = ৩) ছোট ও নিউক্লিয়াসের কাছে, যদিও এর ভেদন কম; 4p এর গড় দূরত্ব বেশি। তাই 3d < 4p < 5s। তবে এটি একটি অভিজ্ঞতালব্ধ নিয়ম — Cr, Cu এর মতো কিছু ক্ষেত্রে শক্তির পার্থক্য খুব কম হওয়ায় ব্যতিক্রম ঘটে।']
  ] }
],
bq: [
  ['সমশক্তিসম্পন্ন অরবিটালের উদাহরণ দাও।', 'pₓ, p<sub>y</sub>, p<sub>z</sub> অথবা পাঁচটি 3d অরবিটাল।'],
  ['p অরবিটাল দিকনির্দেশক কেন?', 'p অরবিটালের লোবগুলো নির্দিষ্ট অক্ষ বরাবর বিন্যস্ত এবং ইলেকট্রন ঘনত্ব সেই দিকে কেন্দ্রীভূত; তাই এরা দিকনির্দেশক এবং নির্দিষ্ট দিকে বন্ধন গঠন করে।'],
  ['একই n এর s ও p এর মধ্যে কোনটির শক্তি কম ও কেন?', 's এর; কারণ s ইলেকট্রনের ভেদন ক্ষমতা বেশি, নিউক্লিয়াসের কাছে যেতে পারে এবং বেশি কার্যকর নিউক্লীয় চার্জ অনুভব করে।'],
  ['অরবিটালের আকৃতি কোন কোয়ান্টাম সংখ্যা নির্ধারণ করে?', 'সহকারী বা অ্যাজিমুথাল কোয়ান্টাম সংখ্যা (l)।']
],
aq: [
  ['4d অরবিটালে রেডিয়াল ও কৌণিক নোড সংখ্যা নির্ণয় করো।', 'n = ৪, l = ২; রেডিয়াল = 4 − 2 − 1 = ১; কৌণিক = ২; মোট = ৩।'],
  ['Zn²⁺ এর ইলেকট্রন বিন্যাস লেখো এবং কোন উপস্তর থেকে ইলেকট্রন সরেছে বলো।', 'Zn: [Ar] 3d¹⁰ 4s²; Zn²⁺: [Ar] 3d¹⁰ — দুটি ইলেকট্রন 4s থেকে সরেছে।'],
  ['n + l = ৬ বিশিষ্ট সব উপস্তর শক্তির ক্রমে সাজাও।', '4d (৪+২), 5p (৫+১), 6s (৬+০) ⟹ 4d < 5p < 6s।']

nq: [

    ['আয়ন দুটির ইলেকট্রন বিন্যাস ও অযুগ্ম ইলেকট্রন সংখ্যা নির্ণয় করো।', 'Fe²⁺: [Ar] 3d⁶ (4s থেকে দুটি সরে) → 3d: [↑↓][↑][↑][↑][↑] → ৪টি অযুগ্ম।<br>Fe³⁺: [Ar] 3d⁵ → [↑][↑][↑][↑][↑] → ৫টি অযুগ্ম।'],
    ['উদ্দীপকের রং পরিবর্তনের কারণ ইলেকট্রন বিন্যাসের আলোকে বিশ্লেষণ করো।', 'হালকা সবুজ রং Fe²⁺ (3d⁶) এর। বাতাসের O₂ দ্বারা Fe²⁺ জারিত হয়ে Fe³⁺ (3d⁵) হয়: 4Fe²⁺ + O₂ + 4H⁺ → 4Fe³⁺ + 2H₂O; Fe³⁺ এর রং হলুদাভ-বাদামি।<br>এই জারণ স্বতঃস্ফূর্ত কারণ Fe³⁺ এর 3d⁵ বিন্যাস অর্ধপূর্ণ — প্রতিসম ও সর্বাধিক বিনিময় শক্তিসম্পন্ন (৫টি সমান্তরাল স্পিন, ১০টি বিনিময় জোড়); অন্যদিকে Fe²⁺ এর 3d⁶ এ একটি অরবিটালে জোড় বাঁধা দুটি ইলেকট্রনের বিকর্ষণ আছে। ষষ্ঠ ইলেকট্রনটি সরে গেলে এই বিকর্ষণ দূর হয় ও অধিক স্থিতিশীল বিন্যাস তৈরি হয়। রং দুটি ভিন্ন কারণ d ইলেকট্রন সংখ্যা ভিন্ন হওয়ায় d-d স্থানান্তরে শোষিত আলোর তরঙ্গদৈর্ঘ্য ভিন্ন।']
  ] },
  { s: 'X ও Y দুটি মৌল। X এর M শক্তিস্তরে ৫টি ইলেকট্রন এবং Y এর N শক্তিস্তরে ২টি ইলেকট্রন আছে; Y এর 3d উপস্তর সম্পূর্ণ পূর্ণ।', p: [
    ['অরবিটাল চিত্র কী?', 'প্রতিটি অরবিটালকে বাক্স এবং ইলেকট্রনকে স্পিনের দিক অনুযায়ী ↑ বা ↓ তীর দিয়ে ইলেকট্রন বিন্যাস দেখানোর পদ্ধতি।'],
    ['X মৌলটি শনাক্ত করো।', 'M স্তরে (n = ৩) ৫টি ইলেকট্রন এবং এর পরে কোনো স্তর নেই ধরে: 1s² 2s² 2p⁶ 3s² 3p³ → মোট ১৫ ⟹ X = P (ফসফরাস)।'],
    ['Y এর ইলেকট্রন বিন্যাস লেখো এবং এর আয়ন Y²⁺ বর্ণহীন কেন ব্যাখ্যা করো।', 'Y: 3d পূর্ণ ও 4s² ⟹ [Ar] 3d¹⁰ 4s² ⟹ Z = ৩০ ⟹ Zn।<br>Zn²⁺: [Ar] 3d¹⁰ — d অরবিটাল সম্পূর্ণ পূর্ণ, কোনো খালি d অরবিটাল নেই; তাই d-d স্থানান্তর সম্ভব নয়, দৃশ্যমান আলো শোষিত হয় না — বর্ণহীন।'],
    ['X ও Y এর চৌম্বক ধর্মের তুলনা করো।', 'X (P): 3p³ — হুন্ডের নীতিতে ৩টি অযুগ্ম ইলেকট্রন ⟹ পরমাণু অবস্থায় প্যারাম্যাগনেটিক; μ = √(3×5) = 3.87 BM।<br>Y (Zn): 3d¹⁰ 4s² — সব ইলেকট্রন যুগ্ম ⟹ ডায়াম্যাগনেটিক (μ = 0)।<br>সুতরাং X চৌম্বকক্ষেত্রে আকৃষ্ট হবে, Y সামান্য বিকর্ষিত হবে। (বিঃদ্রঃ কঠিন ফসফরাস অণু P₄ আকারে থাকে, যেখানে সব ইলেকট্রন বন্ধনে যুগ্ম — তাই বাস্তব নমুনা ডায়াম্যাগনেটিক; এখানে পরমাণুর তুলনা করা হয়েছে।)']
  ] },
  { s: 'শিক্ষক বোর্ডে লিখলেন: ইলেকট্রন-১: (৩, ২, −২, +½), ইলেকট্রন-২: (৩, ২, −২, −½), ইলেকট্রন-৩: (৪, ০, ০, +½)।', p: [
    ['স্পিন কোয়ান্টাম সংখ্যা কী নির্দেশ করে?', 'ইলেকট্রনের নিজ অক্ষের চারদিকে ঘূর্ণনের দিক (+½ বা −½)।'],
    ['ইলেকট্রন-১ ও ২ একই অরবিটালে থাকতে পারে কেন?', 'দুটির n, l, m (৩, ২, −২) একই অর্থাৎ একই 3d অরবিটাল; কিন্তু s ভিন্ন (+½, −½)। চারটি সংখ্যা একসাথে অভিন্ন নয় বলে পাউলির নীতি লঙ্ঘিত হয় না।'],
    ['ইলেকট্রন-৩ যে উপস্তরে আছে তা ইলেকট্রন-১ এর উপস্তরের আগে না পরে পূর্ণ হয়? যুক্তি দাও।', 'ইলেকট্রন-৩: n = ৪, l = ০ → 4s (n+l = ৪)। ইলেকট্রন-১: 3d (n+l = ৫)। তাই 4s আগে পূর্ণ হয়।'],
    ['কোনো পরমাণুতে কেবল এই তিনটি ইলেকট্রন বহিঃস্থ (3d ও 4s এ) থাকলে মৌলটি শনাক্ত করো এবং এর আয়নের স্থিতিশীলতা বিশ্লেষণ করো।', '3d তে ২টি ও 4s এ ১টি: [Ar] 3d² 4s¹? — কিন্তু আউফবাউ অনুযায়ী 4s আগে পূর্ণ হয় (4s²); এবং 3d² এ হুন্ডের নীতি অনুযায়ী দুটি ইলেকট্রন আলাদা অরবিটালে সমান্তরাল স্পিনে থাকার কথা — জোড় বাঁধা নয়। তাই ভূমি অবস্থায় এমন বিন্যাস হয় না; এটি একটি <b>উত্তেজিত অবস্থা</b>।<br>মোট ইলেকট্রন ১৮ + ৩ = ২১ ⟹ Sc। ভূমি অবস্থা: [Ar] 3d¹ 4s²। Sc তিনটি ইলেকট্রন হারিয়ে Sc³⁺ ([Ar]) গঠন করে — নিষ্ক্রিয় গ্যাসের বিন্যাস, অত্যন্ত স্থিতিশীল; তাই Sc এর একমাত্র সাধারণ জারণ অবস্থা +৩ এবং Sc³⁺ বর্ণহীন ও ডায়াম্যাগনেটিক।']
  ] },
  { s: 'রসায়ন ল্যাবে তিনটি লবণের দ্রবণ: (P) CuSO₄ — নীল, (Q) ZnSO₄ — বর্ণহীন, (R) MnSO₄ — হালকা গোলাপি।', p: [
    ['ডায়াম্যাগনেটিক পদার্থ কী?', 'যেসব পদার্থে সব ইলেকট্রন যুগ্ম এবং যা চৌম্বকক্ষেত্র দ্বারা সামান্য বিকর্ষিত হয়।'],
    ['P দ্রবণের ধাতব আয়নের ইলেকট্রন বিন্যাস লেখো।', 'Cu²⁺: Cu = [Ar] 3d¹⁰ 4s¹; দুটি ইলেকট্রন সরে (একটি 4s থেকে, একটি 3d থেকে): [Ar] 3d⁹।'],
    ['R এর ধাতব আয়নের চৌম্বক ভ্রামক নির্ণয় করো।', 'Mn²⁺: [Ar] 3d⁵ ⟹ অযুগ্ম ইলেকট্রন n = ৫ ⟹ μ = √[n(n+2)] = √35 = 5.92 BM।'],
    ['P ও Q এর রঙের পার্থক্য ইলেকট্রন বিন্যাস দিয়ে বিশ্লেষণ করো।', 'P: Cu²⁺ = 3d⁹ — একটি d অরবিটাল অর্ধপূর্ণ। দ্রবণে পানির অণু (লিগ্যান্ড) দ্বারা d অরবিটালগুলোর শক্তি দুই ভাগে বিভক্ত হয়। নিম্ন শক্তির অরবিটাল থেকে একটি ইলেকট্রন দৃশ্যমান আলোর লাল-কমলা অংশ শোষণ করে উচ্চ শক্তির অর্ধপূর্ণ অরবিটালে যায় (d-d স্থানান্তর)। শোষিত রঙের পরিপূরক নীল রং আমরা দেখি।<br>Q: Zn²⁺ = 3d¹⁰ — সব d অরবিটাল পূর্ণ, উপরে যাওয়ার কোনো খালি জায়গা নেই; d-d স্থানান্তর অসম্ভব, দৃশ্যমান আলো শোষিত হয় না ⟹ বর্ণহীন।<br>সুতরাং আংশিক পূর্ণ d অরবিটাল রঙের জন্য দায়ী।']

bq: [
  ['ইলেকট্রন বিন্যাস কাকে বলে?', 'কোনো পরমাণুর বিভিন্ন শক্তিস্তর, উপস্তর ও অরবিটালে ইলেকট্রনগুলোর সজ্জাকে ইলেকট্রন বিন্যাস বলে।'],
  ['কার্বনের 2p উপস্তরে দুটি ইলেকট্রন একই অরবিটালে থাকে না কেন?', 'হুন্ডের নীতি অনুযায়ী সমশক্তির তিনটি 2p অরবিটাল খালি থাকায় ইলেকট্রন দুটি আলাদা অরবিটালে সমান্তরাল স্পিনে থাকে; এতে জোড় বিকর্ষণ এড়ানো যায় ও বিনিময় শক্তি পাওয়া যায়।'],
  ['লিথিয়ামের তৃতীয় ইলেকট্রন 1s এ যায় না কেন?', '1s এ ইতিমধ্যে বিপরীত স্পিনের দুটি ইলেকট্রন আছে; তৃতীয়টি গেলে তার চারটি কোয়ান্টাম সংখ্যা আগের একটির সাথে মিলে যেত — পাউলির নীতি লঙ্ঘিত হতো। তাই এটি 2s এ যায়।'],

  ['নিষ্ক্রিয় গ্যাস কোর পদ্ধতিতে Mn এর বিন্যাস লেখো।', '[Ar] 3d⁵ 4s²।']

nq: [
  ['১ম ২০টি মৌলের মধ্যে কোনগুলোর অযুগ্ম ইলেকট্রন সর্বাধিক? কারণ বিশ্লেষণ করো।', 'N (2p³) ও P (3p³) — প্রত্যেকের ৩টি অযুগ্ম। কারণ p উপস্তরে তিনটি অরবিটাল; হুন্ডের নীতিতে তিনটি ইলেকট্রন আলাদা আলাদা বসে — p উপস্তরে এর বেশি অযুগ্ম ইলেকট্রন সম্ভব নয়।'],
  ['Cr এর বিনিময় শক্তি জোড়ের সংখ্যা দুই বিন্যাসে (3d⁴4s² ও 3d⁵4s¹) তুলনা করো।', 'বিনিময় জোড় = একই স্পিনের ইলেকট্রন থেকে ²Cₖ। 3d⁴4s²: d এ ৪টি সমান্তরাল → ৬ জোড় (4s এর দুটি বিপরীত, তাদের একটি d এর সাথে সমান্তরাল হলেও ভিন্ন উপস্তর)। 3d⁵4s¹: d এ ৫টি সমান্তরাল → ১০ জোড়। d উপস্তরে ৪টি অতিরিক্ত বিনিময় জোড় ও জোড় বিকর্ষণ (4s²) দূর হওয়া — 3d⁵4s¹ কে স্থিতিশীল করে।'],
  ['Fe, Fe²⁺ ও Fe³⁺ কে চৌম্বক ভ্রামকের ঊর্ধ্বক্রমে সাজাও।', 'Fe (3d⁶4s²): ৪ অযুগ্ম, 4.90 BM; Fe²⁺ (3d⁶): ৪, 4.90 BM; Fe³⁺ (3d⁵): ৫, 5.92 BM। ক্রম: Fe = Fe²⁺ < Fe³⁺।']
],

function sampleOrb(key, N = 4200) {

  cap: 'প্রতিটি বিন্দু ইলেকট্রন পাওয়ার একটি সম্ভাব্য অবস্থান — যেখানে বিন্দু ঘন, সেখানে ইলেকট্রন পাওয়ার সম্ভাবনা বেশি। দুই রং তরঙ্গ ফাংশন ψ-এর দুই চিহ্ন (+/−, দশা) বোঝায়। আঙুল দিয়ে টেনে ঘোরাও। হাইড্রোজেন পরমাণুর প্রকৃত তরঙ্গ ফাংশন থেকে বিন্দুগুলো তৈরি।',
  html: () => `<div class="ctl" style="margin:0 0 10px">${X.seg('orb', Object.keys(ORB).map(k => [k, ORB[k].nm]), '2pz')}</div>` + X.cv('৩D অরবিটাল') + `<div class="calc-out" data-out></div><div class="ctl"><button class="btn sm" data-pp></button><span class="small muted">ঘোরাতে টেনে ধরো</span></div>`,
  mount(el) {
    const c = el.querySelector('canvas'); const hf = W => Math.min(420, Math.max(260, W * 0.78)); let L = X.fit(c, hf);
    let key = '2pz', pts = sampleOrb(key), yaw = 0.6, pitch = -0.35;
    const out = el.querySelector('[data-out]');
    const info = () => { const o = ORB[key]; out.innerHTML = `<b>${o.nm}</b> · n = ${X.bn(o.n)}, l = ${X.bn(o.l)} (${'spd'[o.l]}) · রেডিয়াল নোড = n − l − 1 = <b>${X.bn(o.n - o.l - 1)}</b> · কৌণিক নোড = l = <b>${X.bn(o.l)}</b><br>${o.d}`; };
    X.onSeg(el, 'orb', k => { key = k; pts = sampleOrb(k); info(); A.draw(); });
    info();
    const dragging = X.drag(c, (dx, dy) => { yaw += dx * 0.01; pitch = Math.max(-1.5, Math.min(1.5, pitch + dy * 0.01)); A.draw(); });
    const A = X.anim(c, dt => {
      if (!dragging()) yaw += dt * 0.35;
      const C = X.C(), g = L.g, W = L.W, H = L.H, S = Math.min(W, H) * 0.44, cx = W / 2, cy = H / 2;
      const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const P = (x, y, z) => { const X1 = x * cy_ + y * sy, Y1 = -x * sy + y * cy_; const Z2 = z * cp - Y1 * sp, Y2 = z * sp + Y1 * cp; const f = 3.2 / (3.2 + Y2); return [cx + X1 * S * f, cy - Z2 * S * f, Y2]; };
      g.clearRect(0, 0, W, H);
      g.lineWidth = 1; g.font = `12px ${C.mono}`;
      [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']].forEach(([a, b, d, n]) => { const p1 = P(-a * 1.05, -b * 1.05, -d * 1.05), p2 = P(a * 1.12, b * 1.12, d * 1.12); g.strokeStyle = C.ln; g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke(); g.fillStyle = C.mu; g.fillText(n, p2[0] + 3, p2[1] - 3); });
      const pos = C.acc, neg = C.a2;
      for (const [x, y, z, s] of pts) { const p = P(x, y, z); const a = 0.35 + 0.4 * (1 - (p[2] + 1) / 2); g.globalAlpha = a; g.fillStyle = s > 0 ? pos : neg; g.fillRect(p[0] - 1, p[1] - 1, 2.1, 2.1); }
      g.globalAlpha = 1; g.fillStyle = C.fg; const o = P(0, 0, 0); g.beginPath(); g.arc(o[0], o[1], 2.5, 0, 6.283); g.fill();
      g.font = `12px ${C.font}`; g.fillStyle = C.acc; g.fillText('■ ψ ধনাত্মক', 10, H - 26); g.fillStyle = C.a2; g.fillText('■ ψ ঋণাত্মক', 10, H - 9);
    }, { paused: X.rm() });
    X.pp(el, A);
    const ro = X.onResize(el, () => { L = X.fit(c, hf); A.draw(); });
    return () => { A.stop(); ro(); };
  }
};

V.qnExplorer = {

  cap: 'n দিলে l = 0 থেকে n−1, প্রতিটি l-এর জন্য m = −l থেকে +l, এবং প্রতিটি অরবিটালে s = +½ ও −½। নিচে যেকোনো মৌলের শেষ (পার্থক্যকারী) ইলেকট্রনের চারটি কোয়ান্টাম সংখ্যা দেখো।',
